.block-content{padding:10px 12px;display:none;line-height:1.7;font-size:15px}
.block-content.open{display:block}
.derived-list{columns:2;gap:8px}
.derived-item{padding:3px 0.5rem}
</style>

function renderList(){
  const navWrap = document.getElementById("nav-list");
  const mainWrap = document.getElementById("main");
  const kw = document.getElementById("search").value.trim().toLowerCase();
  navWrap.innerHTML="";
  mainWrap.innerHTML="";
  chessData.forEach((item,idx)=>{
    const txt = (item.name+item.quote+item.skill.desc+item.secret.desc+item.secretCard.desc+item.unique.desc+item.derived.join("")).toLowerCase();
    if(kw && !txt.includes(kw)) return;
    // nav
    const navDom = document.createElement("div");
    navDom.className="nav-item";
    navDom.innerText=item.name;
    navDom.onclick=()=>document.getElementById(`c${idx}`).scrollIntoView({behavior:"smooth"});
    navWrap.appendChild(navDom);
    // card
    const card = document.createElement("div");
    card.className="chess-card";
    card.id=`c${idx}`;
    card.innerHTML = `
      <div class="chess-title"><span class="chess-name">${item.name}</span></div>
      <div class="chess-quote">${item.quote?`“${item.quote}”`:""}</div>
      ${buildBlock("技能",item.skill.name,item.skill.desc)}
      ${buildBlock("秘技",item.secret.name,item.secret.desc)}
      ${buildBlock("秘技牌",item.secretCard.name,item.secretCard.desc)}
      ${buildBlock("专属",item.unique.name,item.unique.desc)}
      ${item.derived.length?buildDerived(item.derived):""}
    `;
    mainWrap.appendChild(card);
  })
  bindToggle();
}
function buildBlock(title,sub,desc){
  return `<div class="block">
    <div class="block-title">▸ ${title} · ${sub}</div>
    <div class="block-content">${desc}</div>
  </div>`
}
function buildDerived(list){
  let html = `<div class="block">
    <div class="block-title">▸ 衍生卡牌</div>
    <div class="block-content">
      <div class="derived-list">`;
  list.forEach(i=>html+=`<div class="derived-item">• ${i}</div>`);
  html += `</div></div></div>`;
  return html;
}
function bindToggle(){
  document.querySelectorAll(".block-title").forEach(el=>{
    el.onclick=()=>{
      const c = el.nextElementSibling;
      c.classList.toggle("open");
      el.innerText = c.classList.contains("open") ? `▾ ${el.innerText.slice(2)}` : `▸ ${el.innerText.slice(2)}`;
    }
  })
}
document.getElementById("search").oninput=renderList;
renderList();
