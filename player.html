        }

            width: min(700px,100%);
            margin:0 auto 30px;
            background: #1c212c;
            border: 1px solid #333844;
            border-radius:12px;
            padding:12px 18px;
        }

            background:transparent;
            border:none;
            outline:none;
            color:#e6e8ef;
            font-size:16px;
            padding-left:10px;

        }
        /* 棋手网格 */
        .player-grid{
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(240px,1fr));
            gap:18px;
        }
        .player-card{
            background:#1c212c;
            border:1px solid #282d38;
            border-radius:14px;
            overflow:hidden;
            transition:0.25s;
            cursor:pointer;
        }
        .player-card:hover{
            border-color:rgba(255,211,105,0.4);
            transform: translateY(-4px);
        }
        .card-head{
            padding:16px;
            display:flex;
            align-items:center;
            gap:12px;
            border-bottom:1px solid #282d38;
        }
        .avatar{
            width:52px;
            height:52px;
            border-radius:8px;
            background:#222;
            flex-shrink:0;
        }
        .player-name{
            font-size:18px;
            color:#ffd369;
        }
        .card-body{
            padding:14px 16px;
            font-size:13px;
            color:#b4b9c6;
            line-height:1.6;
        }
        .tag{
            display:inline-block;
            padding:2px 6px;
            background:rgba(255,211,105,0.12);
            color:#ffd369;
            border-radius:4px;
            margin-right:4px;
            margin-bottom:4px;
            font-size:12px;
        }
        /* 弹窗详情 */
        .modal{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.75);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999;
            padding:20px;
        }
        .modal-content{
            width:min(800px,100%);
            background:#181c26;
            border:1px solid #333844;
            border-radius:16px;
            max-height:85vh;
            overflow-y:auto;
            padding:28px;
        }
        .modal-close{
            float:right;
            color:#888;
            font-size:24px;
            cursor:pointer;
        }
        .modal h2{
            color:#ffd369;
            margin-bottom:12px;
        }
        .modal-block{
            margin:16px 0;
        }
        .modal-block h4{
            color:#c8cdd8;
            margin-bottom:6px;
        }
        .modal-block p{
            color:#b4b9c6;
            line-height:1.7;

</head>

// 渲染
const grid = document.getElementById("playerGrid");
const modal = document.getElementById("detailModal");
const modalBody = document.getElementById("modalBody");
const closeModal = document.getElementById("closeModal");
const searchInput = document.getElementById("searchInput");

function render(list){
    grid.innerHTML = "";
    list.forEach(p=>{
        const card = document.createElement("div");
        card.className = "player-card";
        card.innerHTML = `
            <div class="card-head">
                <div class="avatar"></div>
                <div class="player-name">${p.name}</div>
            </div>
            <div class="card-body">
                <span class="tag">技能</span>${p.skill.name}
            </div>
        `;
        card.onclick = ()=>openDetail(p);
        grid.appendChild(card);
    })
}
function openDetail(p){
    let html = `<h2>${p.name}</h2>`;
    if(p.quote) html += `<div class="modal-block"><h4>台词</h4><p>${p.quote}</p></div>`;
    html += `
        <div class="modal-block"><h4>【技能】${p.skill.name}</h4><p>${p.skill.desc}</p></div>
        <div class="modal-block"><h4>【秘技触发】${p.secret.name}</h4><p>${p.secret.desc}</p></div>
        <div class="modal-block"><h4>【秘技牌】${p.secretCard.name}</h4><p>${p.secretCard.desc}</p></div>
        <div class="modal-block"><h4>【专属】${p.unique.name}</h4><p>${p.unique.desc}</p></div>
    `;
    if(p.derivedCardList && p.derivedCardList.length>0){
        html += `<div class="modal-block"><h4>衍生卡牌</h4>`;
        p.derivedCardList.forEach(d=>{
            html += `<p><span class="tag">${d.name}</span> ${d.desc}</p>`
        })
        html += `</div>`
    }
    modalBody.innerHTML = html;
    modal.style.display = "flex";
}
closeModal.onclick = ()=> modal.style.display = "none";
modal.onclick = (e)=>{ if(e.target===modal) modal.style.display = "none"; }

// 搜索过滤
searchInput.oninput = ()=>{
    const kw = searchInput.value.trim().toLowerCase();
    const filter = playerList.filter(i=>i.name.toLowerCase().includes(kw));
    render(filter);
}
render(playerList);
