<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #12161f;
            color: #e6e8ef;
            background-image: radial-gradient(circle at 40% 20%, rgba(204, 164, 79, 0.08), transparent 45%);
            min-height: 100vh;
        }

        /* 顶部导航 */
        .top-nav-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 20px;
            background-color: rgba(18, 22, 31, 0.75);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .top-nav-wrap a {
            text-decoration: none;
            color: #b4b9c6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .top-nav-wrap a:hover {
            color: #ffd369;
            background-color: rgba(255, 211, 105, 0.08);
        }

        .top-nav-wrap a.active {
            color: #ffd369;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .page-title {
            font-size: 32px;
            text-align: center;
            margin-bottom: 24px;
            color: #ffd369;
        }

        /* 搜索框 */
        .search-box {
            display: flex;
            align-items: center;
            width: min(700px, 100%);
            margin: 0 auto 30px;
            background: #1c212c;
            border: 1px solid #333844;
            border-radius: 12px;
            padding: 12px 18px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e6e8ef;
            font-size: 16px;
            padding-left: 10px;
        }

        .search-box input::placeholder {
            color: #686e7c;
        }

        /* 棋手网格 */
        .player-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 18px;
        }

        /* 参考图风格卡片 */
        .player-card {
            background: linear-gradient(135deg, #1c212c 0%, #272d3b 100%);
            border: 1px solid #333844;
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .player-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #ffd369, #ff9f43);
            opacity: 0;
            transition: 0.3s;
        }

        .player-card:hover {
            border-color: rgba(255, 211, 105, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(255, 211, 105, 0.15);
        }

        .player-card:hover::before {
            opacity: 1;
        }

        /* 头像区 */
        .card-avatar {
            width: 90px;
            height: 90px;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid #333844;
            background: #0f1218;
            position: relative;
        }

        .card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-avatar .avatar-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #ffd369;
            background: linear-gradient(135deg, #2a2f3c, #171a23);
        }

        /* 文字区 */
        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .card-name {
            font-size: 20px;
            font-weight: 700;
            color: #ffd369;
        }

        .card-role-tag {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            color: #12161f;
            background: #ffd369;
            font-weight: 700;
            white-space: nowrap;
        }

        .card-quote {
            font-size: 13px;
            color: #9aa0b0;
            line-height: 1.5;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-skill {
            font-size: 13px;
            color: #c8cdd8;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .card-skill-label {
            color: #ffd369;
            font-weight: 700;
        }

        .card-skill-text {
            color: #b4b9c6;
        }

        /* 弹窗 */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            width: min(820px, 100%);
            background: #181c26;
            border: 1px solid #333844;
            border-radius: 20px;
            max-height: 86vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            float: right;
            color: #888;
            font-size: 26px;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-close:hover {
            color: #ffd369;
        }

        .modal h2 {
            color: #ffd369;
            margin-bottom: 10px;
            font-size: 26px;
        }

        .modal-quote {
            color: #9aa0b0;
            font-style: italic;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .modal-role {
            display: inline-block;
            padding: 4px 10px;
            background: #ffd369;
            color: #12161f;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .modal-block {
            margin: 16px 0;
            background: #1c212c;
            border: 1px solid #282d38;
            border-radius: 14px;
            padding: 16px 18px;
        }

        .modal-block h4 {
            color: #ffd369;
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-block h4::before {
            content: "";
            width: 3px;
            height: 14px;
            background: #ffd369;
            border-radius: 2px;
        }

        .modal-block p {
            color: #b4b9c6;
            line-height: 1.8;
            font-size: 14px;
        }

        .derived-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .derived-item {
            background: #242a37;
            border: 1px solid #2f3544;
            border-radius: 10px;
            padding: 10px 12px;
        }

        .derived-item .tag {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(255, 211, 105, 0.14);
            color: #ffd369;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .derived-item p {
            color: #b4b9c6;
            line-height: 1.6;
            font-size: 13px;
        }

        /* 滚动条美化 */
        .modal-content::-webkit-scrollbar,
        .player-grid::-webkit-scrollbar {
            width: 8px;
        }

        .modal-content::-webkit-scrollbar-thumb,
        .player-grid::-webkit-scrollbar-thumb {
            background: #333844;
            border-radius: 4px;
        }

        .modal-content::-webkit-scrollbar-thumb:hover,
        .player-grid::-webkit-scrollbar-thumb:hover {
            background: #ffd369;
        }
    </style>
</head>

const grid = document.getElementById("playerGrid");
const modal = document.getElementById("detailModal");
const modalBody = document.getElementById("modalBody");
const closeModal = document.getElementById("closeModal");
const searchInput = document.getElementById("searchInput");

function render(list) {
    grid.innerHTML = "";
    list.forEach(p => {
        const card = document.createElement("div");
        card.className = "player-card";
        card.innerHTML = `
            <div class="card-avatar">
                ${p.avatar ? `<img src="${p.avatar}" alt="${p.name}">` : `<div class="avatar-placeholder">${p.name.charAt(0)}</div>`}
            </div>
            <div class="card-info">
                <div class="card-name-row">
                    <span class="card-name">${p.name}</span>
                    <span class="card-role-tag">${p.role || "暂无定位"}</span>
                </div>
                <div class="card-quote">${p.quote ? `“${p.quote}”` : "暂无台词"}</div>
                <div class="card-skill">
                    <span class="card-skill-label">技能：</span>
                    <span class="card-skill-text">${p.skill.name}</span>
                </div>
            </div>
        `;
        card.onclick = () => openDetail(p);
        grid.appendChild(card);
    });
}

function openDetail(p) {
    let html = `
        <h2>${p.name}</h2>
        <div class="modal-quote">${p.quote ? `“${p.quote}”` : "暂无台词"}</div>
        <div class="modal-role">${p.role || "暂无定位"}</div>
        <div class="modal-block">
            <h4>技能</h4>
            <p><strong style="color:#ffd369">${p.skill.name}</strong></p>
            <p>${p.skill.desc}</p>
        </div>
        <div class="modal-block">
            <h4>秘技触发</h4>
            <p><strong style="color:#ffd369">${p.secret.name}</strong></p>
            <p>${p.secret.desc}</p>
        </div>
        <div class="modal-block">
            <h4>秘技牌</h4>
            <p><strong style="color:#ffd369">${p.secretCard.name}</strong></p>
            <p>${p.secretCard.desc}</p>
        </div>
        <div class="modal-block">
            <h4>专属</h4>
            <p><strong style="color:#ffd369">${p.unique.name}</strong></p>
            <p>${p.unique.desc}</p>
        </div>
    `;

    if (p.derivedCardList && p.derivedCardList.length > 0) {
        html += `<div class="modal-block"><h4>衍生卡牌</h4><div class="derived-grid">`;
        p.derivedCardList.forEach(d => {
            html += `
                <div class="derived-item">
                    <span class="tag">${d.name}</span>
                    <p>${d.desc}</p>
                </div>
            `;
        });
        html += `</div></div>`;
    }

    modalBody.innerHTML = html;
    modal.style.display = "flex";
}

closeModal.onclick = () => modal.style.display = "none";
modal.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

searchInput.oninput = () => {
    const kw = searchInput.value.trim().toLowerCase();
    if (!kw) {
        render(playerList);
        return;
    }
    const filter = playerList.filter(p => {
        const txt = (
            p.name +
            (p.role || "") +
            p.quote +
            p.skill.name +
            p.skill.desc +
            p.secret.name +
            p.secret.desc +
            p.secretCard.name +
            p.secretCard.desc +
            p.unique.name +
            p.unique.desc +
            p.derivedCardList.map(x => x.name + x.desc).join("")
        ).toLowerCase();
        return txt.includes(kw);
    });
    render(filter);
};

render(playerList);
</script>
