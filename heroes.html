<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>英雄牌</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- 顶部导航 -->
<div class="top-nav-wrap">
    <a href="./index.html">首页</a>
    <a href="./lineup.html">阵容大全</a>
    <a href="./player.html">棋手</a>
    <a href="./hero-card.html" class="active">英雄牌</a>
    <a href="./talent.html">天赋牌</a>
    <a href="./equip.html">装备牌</a>
    <a href="./effect.html">效果牌</a>
    <a href="./info-gap.html">信息差</a>
</div>

<div class="container">
    <h2 class="page-title">英雄牌</h2>

    <!-- 搜索框 -->
    <div class="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#888e9c">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input id="searchInput" type="text" placeholder="搜索名称、描述、阵营或相关关键词..." />
    </div>

    <!-- 筛选区 -->
    <div class="filter-wrap">
        <div class="filter-row">
            <select id="stageFilter" class="filter-select">
                <option value="all">全部品阶</option>
                <option value="1">1阶</option>
                <option value="2">2阶</option>
                <option value="3">3阶</option>
                <option value="4">4阶</option>
                <option value="5">5阶</option>
            </select>

            <select id="campFilter" class="filter-select">
                <option value="all">全部阵营</option>
                <option value="大河流域">大河流域</option>
                <option value="河洛">河洛</option>
                <option value="日落海">日落海</option>
                <option value="三分之地">三分之地</option>
                <option value="逐鹿">逐鹿</option>
                <option value="无阵营">无阵营</option>
            </select>

            <select id="keywordFilter" class="filter-select">
                <option value="all">全部关键词</option>
                <option value="牺牲">牺牲</option>
                <option value="合成">合成</option>
                <option value="整备">整备</option>
                <option value="阿科米亚核心">阿科米亚核心</option>
                <option value="登场">登场</option>
                <option value="凯旋">凯旋</option>
                <option value="临时等级">临时等级</option>
                <option value="退场">退场</option>
                <option value="败阵">败阵</option>
                <option value="开团">开团</option>
                <option value="图腾">图腾</option>
                <option value="夺取">夺取</option>
                <option value="闪现">闪现</option>
                <option value="复生">复生</option>
            </select>
        </div>
    </div>

    <!-- 英雄牌列表 -->
    <div class="hero-card-grid" id="heroCardList"></div>
</div>

<!-- 详情弹窗 -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <span class="modal-close" id="closeModal">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
