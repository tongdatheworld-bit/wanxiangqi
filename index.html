<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者万象棋 - 万象一图诀</title>
    <base href="./">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #12161f;
            color: #e6e8ef;
            background-image: radial-gradient(circle at 40% 20%, rgba(204, 164, 79, 0.08), transparent 45%);
            min-height: 100vh;
        }
        /* 顶部导航栏 */
        .top-nav-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 20px;
            background-color: rgba(18, 22, 31, 0.75);
            backdrop-filter: blur(10px);
            position: sticky;
            top:0;
            z-index:99;
        }
        .top-nav-wrap a {
            text-decoration: none;
            color: #b4b9c6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }
        .top-nav-wrap a:hover {
            color: #ffd369;
            background-color: rgba(255,211,105,0.08);
        }
        .top-nav-wrap a.active {
            color: #ffd369;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        .subtitle-tag {
            color: #b8a060;
            letter-spacing: 4px;
            font-size:14px;
            margin-bottom:12px;
        }
        h1 {
            font-size: 64px;
            line-height: 1.2;
            font-weight: 600;
        }
        h1 span {
            color: #ffd369;
        }
        .desc-line {
            color:#9298a6;
            margin:14px 0 40px;
            font-size:14px;
        }
        /* 搜索框 */
        .search-box {
            display:flex;
            align-items:center;
            width: min(900px, 100%);
            margin:0 auto 40px;
            background: #1c212c;
            border: 1px solid #333844;
            border-radius:12px;
            padding:14px 20px;
        }
        .search-box input {
            flex:1;
            background:transparent;
            border:none;
            outline:none;
            color:#e6e8ef;
            font-size:16px;
            padding-left:10px;
        }
        .search-box input::placeholder {
            color:#686e7c;
        }
        .search-hint {
            color:#686e7c;
            font-size:13px;
            margin-bottom:50px;
        }
        /* 卡片区域 */
        .card-grid {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
            gap:16px;
        }
        .preview-card {
            background:#1c212c;
            border-radius:10px;
            padding:14px;
            display:flex;
            align-items:center;
            gap:10px;
            border:1px solid #282d38;
            transition:0.2s;
        }
        .preview-card:hover {
            border-color:rgba(255,211,105,0.35);
        }
        .preview-card img {
            width:48px;
            height:48px;
            border-radius:6px;
            object-fit:cover;
        }
        .card-text p:first-child {
            color:#ffd369;
            font-size:13px;
        }
        .card-text p:last-child {
            font-size:15px;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-nav-wrap">
        <a href="./index.html">首页</a>
        <a href="./lineup.html">阵容大全</a>
        <a href="./player.html">棋手</a>
        <a href="./hero-card.html">英雄牌</a>
        <a href="./talent.html">天赋牌</a>
        <a href="./equip.html">装备牌</a>
        <a href="./effect.html">效果牌</a>
        <a href="./info-gap.html">信息差</a>
    </div>

    <div class="container">
        <div class="subtitle-tag">WANGZHE WANXIANGQI DATA</div>
       <h1>致力于做王者万象棋最全攻略<br>
       <span>万象棋启动</span>
        </h1>
        <div class="desc-line">万象一图诀 · 友情打造</div>

        <div class="search-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#888e9c">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" placeholder="搜索棋手、英雄牌、装备牌、效果牌...">
            <span style="color:#777; font-size:13px;">⌘ K</span>
        </div>
        <div class="search-hint">支持拼音与首字母 · 覆盖全部游戏资料 · 数据持续更新</div>

        <!-- 预览卡片区域，你后续可以替换图片 -->
        <div class="card-grid">
            <div class="preview-card">
                <div style="width:48px;height:48px;border-radius:6px;background:#222;"></div>
                <div class="card-text">
                    <p>棋手</p>
                    <p>阿离</p>
                </div>
            </div>
            <div class="preview-card">
                <div style="width:48px;height:48px;border-radius:6px;background:#222;"></div>
                <div class="card-text">
                    <p>英雄牌</p>
                    <p>亚连</p>
                </div>
            </div>
            <div class="preview-card">
                <div style="width:48px;height:48px;border-radius:6px;background:#222;"></div>
                <div class="card-text">
                    <p>装备牌</p>
                    <p>雷鸣刃</p>
                </div>
            </div>
            <div class="preview-card">
                <div style="width:48px;height:48px;border-radius:6px;background:#222;"></div>
                <div class="card-text">
                    <p>效果牌</p>
                    <p>幸运礼</p>
                </div>
            </div>
        </div>
    </div>

    <script src="./app.js"></script>
    <!-- 导航自动高亮脚本 -->
    <script>
    (function(){
      const navLinks = document.querySelectorAll('.top-nav-wrap a');
      const currentPath = location.pathname.split('/').pop() || 'index.html';
      navLinks.forEach(link => {
        link.classList.remove('active');
        const href = link.getAttribute('href').replace('./','');
        if(href === currentPath){
          link.classList.add('active');
        }
      })
    })();
    </script>
</body>
</html>
