<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者万象棋 - 万象一图诀</title>
    <base href="./">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #12161f;
            color: #e6e8ef;
            background-image:
                radial-gradient(circle at 40% 20%, rgba(204, 164, 0, 0.08), transparent 45%);
            min-height: 100vh;
        }
        /* 顶部导航栏 */
        .top-nav-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 20px;
            background-color: rgba(18, 22, 31, 0.75);
            backdrop-filter: blur(10px);
            position: sticky;
            top:0;
            z-index:99;
        }
        .top-nav-wrap a {
            text-decoration: none;
            color: #b4b9c6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }
        .top-nav-wrap a:hover {
            color: #ffd369;
            background-color: rgba(255,211,105,0.08);
        }
        .top-nav-wrap a.active {
            color: #ffd369;
            position: relative;
        }
        .top-nav-wrap a.active::after{
            content:'';
            position:absolute;
            left:16px;
            right:16px;
            bottom:-4px;
            height:4px;
            background:#ffd369;
            border-radius:99px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        .subtitle-tag {
            color: #b8a060;
            letter-spacing: 4px;
            font-size:14px;
            margin-bottom:12px;
        }
        h1 {
            font-size: 42px;
            line-height: 1.2;
            font-weight: 600;
        }
        .yellow-text {
            color: #ffd369;
        }
        .desc-line {
            color:#9298a6;
            margin:14px 0 40px;
            font-size:14px;
        }
        /* 搜索框 */
        .search-box {
            display:flex;
            align-items:center;
            width: min(900px, 100%);
            margin:0 auto 20px;
            background: #1c212c;
            border: 1px solid #333844;
            border-radius:12px;
            padding:14px 20px;
        }
        .search-box input {
            flex:1;
            background:transparent;
            border:none;
            outline:none;
            color:#e6e8ef;
            font-size:16px;
            padding-left:10px;
        }
        .search-box input::placeholder {
            color:#686e7c;
        }
        .search-hint {
            color:#686e7c;
            font-size:13px;
            margin-bottom:24px;
        }
        .lineup-list {
            display: flex;
            flex-direction: column;
            gap:20px;
        }
        .ban-sep {
            color:#9aa0b0;
            margin:0 4px;
            font-size:16px;
        }
        .ban-title-tag {
            background:#d92424;
            color:#ffffff;
            padding:4px 10px;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            margin-right:6px;
        }
        /* 阵容卡片 */
        .lineup-card {
            background: #171c29;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .lineup-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(255, 211, 105, 0.15);
        }

        /* 【上层：文字信息行】 */
        .lineup-info-top {
            display: flex;
            align-items: center;
            gap:12px;
            flex-wrap: nowrap;
            margin-bottom:16px;
        }
        .lineup-name {
            font-size:28px;
            font-weight:bold;
            color:#ffd369;
            white-space: nowrap;
        }
        .ban-title-tag {
            background-color:#d62222;
            color:#fff;
            padding:4px 8px;
            border-radius:6px;
            font-weight:bold;
        }
        .ban-item {
            padding:4px 10px;
            background:#282e3b;
            border-radius:6px;
            color:#ffd369;
            font-weight: 700;
        }
        .lineup-meta {
            color:#b1b6c2;
            font-size:15px;
            margin-left:auto;
            white-space: nowrap;
        }
               .copy-code {
            display: inline-flex;
            align-items: center;
            gap:6px;
            font-size: 14px;
            color: #ffd369;
            background: rgba(255, 211, 105, 0.08);
            border: 1px solid rgba(255, 211, 105, 0.25);
            padding: 4px 10px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .copy-code:hover {
            background: rgba(255, 211, 105, 0.16);
            text-decoration: none;
        }
        .copy-code.copied {
            border-color: #39d977;
            background: rgba(57, 217, 119, 0.12);
            color: #69ff94;
        }
        .copy-normal, .copy-success {
            display: inline-flex;
            align-items: center;
            gap:4px;
        }
        .copy-success {
            display: none;
        }
        .copy-code.copied .copy-normal {
            display: none;
        }
        .copy-code.copied .copy-success {
            display: inline-flex;
        }

        /* 【下层：横向一行：强度 + 棋手组 + 英雄组】 */
        .lineup-bottom-row {
            display: flex;
            align-items: center;
            gap:16px;
        }
        /* S+强度方块 */
        .lineup-rank {
            width:90px;
            height:90px;
            flex-shrink:0;
            background:#7b3fd8;
            border-radius:16px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:36px;
            font-weight:900;
            color:#fff;
        }
        /* 棋手区域：主棋手 + 备选棋手 */
        .player-group {
            display:flex;
            align-items:center;
            gap:10px;
            flex-shrink:0;
        }
        .main-player {
            width:90px;
            height:90px;
            border-radius:16px;
            overflow:hidden;
        }
        .main-player img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .alternate-col {
            display:flex;
            flex-direction:column;
            gap:6px;
        }
        .alternate-player-label {
            background:rgba(255,211,105,0.12);
            color:#ffd369;
            font-size:12px;
            padding:2px 6px;
            border-radius:4px;
            text-align:center;
            width:fit-content;
        }
        .alternate-wrap {
            display:flex;
            gap:6px;
        }
        .alt-player {
            width:56px;
            height:56px;
            border-radius:12px;
            overflow:hidden;
        }
        .alt-player img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        /* 分割线样式 */
        .hero-divider {
            width: 2px;
            height: 52px;
            background: #2f3542;
            border-radius: 1px;
            flex-shrink: 0;
            margin:0 6px;
        }
        /* 英雄区域，自动占满剩余宽度 */
        .hero-row {
            display:flex;
            gap:10px;
            flex:1;
            justify-content:flex-start;
            align-items:center;
        }
        .mini-hero {
            width:90px;
            height:90px;
            border-radius:16px;
            overflow:hidden;
            position:relative;
            flex-shrink:0;
        }
        .mini-hero img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .mini-hero.core::after {
            content:"核";
            position:absolute;
            top:-4px;
            right:-4px;
            width:22px;
            height:22px;
            background:#7b3fd8;
            color:#fff;
            font-size:12px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        /* ====================== 弹窗样式（和lineup.html完全一致） ====================== */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            width: min(860px, 100%);
            background: #171a23;
            border: 1px solid #2a2f3d;
            border-radius: 18px;
            max-height: 92vh;
            overflow-y: auto;
            padding: 24px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .modal-close {
            float: right;
            color: #7c8292;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1;
        }
        .modal-close:hover {
            color: #ffd369;
        }
        .modal-top-info {
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:18px;
        }
        .player-avatar {
            width:70px;
            height:70px;
            border-radius:14px;
            object-fit:cover;
        }
        .info-text h2 {
            color:#ffd369;
            font-size:24px;
            margin-bottom:4px;
        }
        .modal-sub {
            color:#9aa0b0;
            font-size:14px;
        }
        .modal-block {
            background: #1c212c;
            border: 1px solid #282d38;
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 16px;
        }
        .modal-block h4 {
            color: #ffd369;
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .empty-text {
            color:#686e7c;
        }
        .mini-hero-modal {
            width:82px;
            height:82px;
            border-radius:10px;
            overflow:hidden;
            position:relative;
            flex-shrink:0;
        }
        .mini-hero-modal img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .mini-hero-modal.core {
            position: relative;
        }
        .mini-hero-modal.core::after {
            content: "核";
            position: absolute;
            top: -10px;
            right: -14px;
            width: 22px;
            height: 22px;
            background: #7b3fd8;
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            box-shadow: 0 0 0 2px #171a23;
        }
        .hero-row-modal {
            display:flex;
            gap:12px;
            flex-wrap:wrap;
        }
        .equip-pill {
            width:44px;
            height:44px;
            border-radius:12px;
            overflow:hidden;
            border:1px solid #333844;
            background:#282e3b;
            flex-shrink:0;
        }
        .equip-pill img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .equip-list {
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .code-text {
            color:#ffd369;
            cursor:pointer;
        }
        .code-text:hover {
            text-decoration:underline;
        }
        /* 阵容组成：头像+下方名字 */
        .lineup-hero-row {
            display: flex;
            gap:12px;
            flex-wrap: wrap;
        }
        .lineup-hero-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap:4px;
        }
        .hero-name-text {
            font-size:12px;
            color:#c7cad4;
        }
        /* 功能性英雄：左头像，右名称+描述 */
        .func-hero-list {
            display:flex;
            flex-direction: column;
            gap:14px;
        }
        .func-hero-item {
            display:flex;
            align-items: flex-start;
            gap:12px;
        }
        .func-info {
            flex:1;
        }
        .func-name {
            color:#ffd369;
            font-size:15px;
            font-weight:bold;
            margin-bottom:3px;
        }
        .func-desc {
            font-size:15px;
            color:#ffffff;
            line-height:1.7;
        }
        /* ===== 装备选择：首选、备选左右并排，不再上下分行 ===== */
        .equip-area {
          background: #1c212c;
          border: 1px solid #282d38;
          border-radius: 14px;
          padding: 16px 18px;
          margin-bottom: 16px;
        }
        .equip-area-title {
          display: flex;
          align-items: center;
          gap: 8px;
          color: #ffd369;
          font-size: 15px;
          font-weight: 800;
          margin-bottom: 14px;
        }
        .equip-area-title::before {
          content: "|";
          color: #ffd369;
          font-weight: 900;
        }
        .equip-main-row {
          display: flex;
          align-items: center;
          gap: 18px;
        }
        .equip-main-hero {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
          flex-shrink: 0;
        }
        .equip-main-hero .mini-hero-modal {
          width: 82px;
          height: 82px;
          border-radius: 16px;
          border: 1px solid #333844;
          overflow: hidden;
          background: #282e3b;
        }
        .equip-main-hero .mini-hero-modal img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        .equip-main-hero .hero-name-text {
          font-size: 12px;
          color: #cfd3de;
        }
        /* 右侧：首选和备选左右并排 */
        .equip-side {
          flex: 1;
          display: flex;
          align-items: center;
          gap: 28px;
          min-width: 0;
        }
        .equip-group {
          display: flex;
          align-items: center;
          gap: 12px;
        }
        .equip-group-label {
          color: #ffd369;
          font-size: 14px;
          font-weight: 800;
          white-space: nowrap;
        }
        .equip-list-row {
          display: flex;
          align-items: center;
          gap: 12px;
          flex-wrap: nowrap;
        }
        .equip-pill {
          width: 44px;
          height: 44px;
          border-radius: 12px;
          border: 1px solid #333844;
          background: #282e3b;
          overflow: hidden;
          flex-shrink: 0;
        }
        .equip-pill img {
          width: 100%;
          height: 100%;
          object-fit: cover;
          display: block;
        }
        /* ====== 运营节奏文字统一为注意事项样式 ====== */
        .run-stage-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .stage-block {
            background: #1c212c;
            border: 1px solid #282d38;
            border-radius: 14px;
            padding: 16px 18px;
        }
        .stage-title {
            margin-bottom: 10px;
        }
        .run-stage-tag {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 8px;
            background: linear-gradient(135deg, #ffd369, #ffb020);
            color: #12161f;
            font-size: 14px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(255, 176, 32, 0.35);
            letter-spacing: 1px;
        }
        /* 运营节奏英雄图标：一排最多7个，左对齐，固定尺寸 */
        .stage-heroes {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-start;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .hero-pill.small {
            width: 82px;
            height: 82px;
            border-radius: 10px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .hero-pill.small img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* 运营节奏正文：跟注意事项保持一致 */
        .stage-desc {
            color: #f2f4fa;
            line-height: 1.7;
            font-size: 16px;
            margin: 0;
            padding: 0;
        }
        /* 注意事项原有样式保持，只做对齐 */
        .notice-list {
            padding-left: 22px;
            margin: 8px 0;
        }
        .notice-list li {
            color: #f2f4fa;
            line-height: 1.7;
            font-size: 16px;
            margin-bottom: 8px;
            word-break: break-word;
        }
        .position-image-box img {
            max-width:100%;
            border-radius:12px;
        }
        .position-image-placeholder {
            text-align:center;
            color:#686e7c;
            padding:20px;
        }
        /* 弹窗滚动条 */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: #333844;
            border-radius: 4px;
        }
        .modal-content::-webkit-scrollbar-thumb:hover {
            background: #ffd369;
        }
        .name-code-row {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .name-code-row h2 {
            margin: 0;
            font-size: 24px;
            color: #ffd369;
        }
        .name-code-row .code-text {
            display: inline-flex;
            align-items: center;
            gap:6px;
            font-size: 14px;
            color: #ffd369;
            background: rgba(255, 211, 105, 0.08);
            border: 1px solid rgba(255, 211, 105, 0.25);
            padding: 4px 10px;
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .name-code-row .code-text:hover {
            background: rgba(255, 211, 105, 0.16);
        }
        .name-code-row .code-text.copied {
            border-color: #39d977;
            background: rgba(57, 217, 119, 0.12);
            color: #69ff94;
        }
        .code-normal, .code-success {
            display: inline-flex;
            align-items: center;
            gap:4px;
        }
        .code-success {
            display: none;
        }
        .code-text.copied .code-normal {
            display: none;
        }
        .code-text.copied .code-success {
            display: inline-flex;
        }
        /* 天赋推荐：一个统一底框包裹，内部三列 */
        .talent-board {
            background: #1e232f;
            border: 1px solid #383e4c;
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: flex-start;
        }
        .talent-three-col {
            display: grid;
            grid-template-columns: repeat(3, 180px);
            gap: 16px;
            justify-content: flex-start;
            align-items: flex-start;
        }
        .talent-col-block {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
        }
        .talent-col-title {
            font-size: 14px;
            font-weight: bold;
            color: #ffd369;
            padding: 5px 12px;
            border-radius: 8px;
            display: inline-block;
            width: fit-content;
        }
        .talent-col-tong .talent-col-title {
            background: #70543c;
            color: #ffddb0;
        }
        .talent-col-yin .talent-col-title {
            background: #787c84;
            color: #e8ebf0;
        }
        .talent-col-jin .talent-col-title {
            background: #b88600;
            color: #fff8e0;
        }
        .talent-col-cards {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 12px;
        }
        .talent-card-full {
            background: #1e232f;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #383e4c;
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 160px;
            margin: 0;
        }
        .talent-card-imgbox {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #252b38;
            padding: 10px;
        }
        .talent-card-imgbox img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        .talent-card-name {
            text-align: center;
            padding: 6px 0;
            color: #ffd369;
            font-weight: bold;
            font-size: 15px;
            background: #222733;
        }
        /* 效果牌卡片样式 */
        .effect-three-col {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px,1fr));
            gap:12px;
        }
        .effect-card-full {
            background: #1e232f;
            border-radius: 14px;
            overflow: hidden;
            border: 1px solid #383e4c;
            display: flex;
            flex-direction: column;
        }
        .effect-card-imgbox {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #252b38;
            padding: 6px;
        }
        .effect-card-imgbox img {
            width: 100%;
            height: auto;
            object-fit: contain;
        }
        .effect-card-name {
            text-align: center;
            padding: 4px 0;
            color: #ffd369;
            font-weight: bold;
            font-size: 14px;
            background: #222733;
        }
        /* 解锁弹窗 */
        #lockModal{
            position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9999;display:flex;align-items:center;justify-content:center;
        }
    </style>
</head>
<body>
<div id="mainContent">
    <div class="top-nav-wrap">
        <a href="./index.html" class="active">首页</a>
        <a href="./lineup.html">阵容大全</a>
        <a href="./player.html">棋手</a>
        <a href="./hero-card.html">英雄牌</a>
        <a href="./talent.html">天赋牌</a>
        <a href="./equip.html">装备牌</a>
        <a href="./effect.html">效果牌</a>
        <a href="./info-gap.html">信息差</a>
    </div>
    <div class="container">
        <div class="subtitle-tag">WANGZHE WANXIANGQI</div>
        <h1>致力于做王者万象棋最全攻略
            <br>
            <span class="yellow-text">万象棋启动</span>
        </h1>
        <div class="desc-line">万象一图诀 · 友情打造</div>
        <div class="search-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#888e9c">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" placeholder="搜索棋手、英雄牌、装备牌、效果牌...">
            <span style="color:#777; font-size:13px;">⌘ K</span>
        </div>
        <div class="search-hint">支持拼音与首字母 · 覆盖全部游戏资料 · 数据持续更新</div>

            <h3 style="font-size:22px;color:#ffd369;margin-bottom:18px;text-align:center;">最新阵容强度排行榜</h3>
        </div>
        <!-- 修改这里的数字，逗号分隔，就是首页要展示的阵容ID -->
        <div id="homeShowIdList" style="display:none">1,7,2,4,8,9,10,13,77,16,11,6,12,14,18,60,39,30</div>
        <div class="lineup-list" id="homeTopList"></div>
    </div>
    <script src="./app.js"></script>
    <script>
        (function(){
            const navLinks = document.querySelectorAll('.top-nav-wrap a');
            const currentPath = location.pathname.split('/').pop() || 'index.html';
            navLinks.forEach(link => {
                link.classList.remove('active');
                const href = link.getAttribute('href').replace('./','');
                if(href === currentPath){
                    link.classList.add('active');
                }
            })
        })();
    </script>
    <script>
        let lineupList = [];
        let currentLineup = null;
        let modalDom = null;
        let modalInner = null;
        function closeModal(){
            if(!modalDom) return;
            modalDom.style.display = 'none';
        }

        async function loadLineupJson() {
            try {
                // ✅ 修改选择器：现在是 .modal 和 #modalBody
                modalDom = document.querySelector('.modal');
                modalInner = document.querySelector('#modalBody');
                // 遮罩点击关闭逻辑
                modalDom.addEventListener('click', function(e){
                    if(e.target === modalDom){
                        closeModal();
                    }
                })
                const res = await fetch("./lineup.json");
                lineupList = await res.json();
                renderHomeTopRank();
            } catch (err) {
                console.error("加载 lineup.json 失败：", err);
                const wrap = document.getElementById('homeTopList');
                if(wrap) wrap.innerHTML = `<p style="color:#ff8888">❌ 阵容数据加载失败，请检查 lineup.json 文件路径</p>`;
            }
        }

        // 复制阵容码（带copied反馈）
        async function copyCode(ele, rawCode) {
            const realCode = rawCode.split("（")[0];
            try {
                await navigator.clipboard.writeText(realCode)
                ele.classList.add('copied');
                setTimeout(()=>{ele.classList.remove('copied');}, 1800);
            } catch (e) {
                alert("复制失败，请手动复制：" + realCode)
            }
        }

        // 生成卡片
        function buildCard(item){
            const div = document.createElement('div');
            div.className = "lineup-card";
            div.dataset.id = item.id;

            // Ban位标签
            let banHtml = '';
            if(Array.isArray(item["ban位"]) && item["ban位"].length > 0){
                banHtml = `<span class="ban-title-tag">Ban阵营：</span>`
                    + item["ban位"].map(b=>`<span class="ban-item">${b}</span>`).join('');
            }

            // 英雄列表 + 核标记
            let heroHtml = '';
            if(Array.isArray(item.heroList)){
                heroHtml = item.heroList.map(h=>`
             <div class="mini-hero ${h.isCore ? 'core' : ''}">
                 <img src="${h.img}" alt="${h.name}">
             </div>
         `).join('');
            }

            // 备选棋手
            let alternatePlayerHtml = '';
            if(Array.isArray(item.alternatePlayer) && item.alternatePlayer.length > 0){
                alternatePlayerHtml = `
             <div class="alternate-col">
                 <div class="alternate-player-label">备选棋手</div>
                 <div class="alternate-wrap">
                     ${item.alternatePlayer.map((_, idx)=>{
                         const src = item.alternatePlayerImg?.[idx] || "";
                         return `<div class="alt-player"><img src="${src}"></div>`;
                     }).join('')}
             </div>
         </div>
         `;
            }

            div.innerHTML = `
         <div class="lineup-info-top">
             <div class="lineup-name">${item.name}</div>
             ${banHtml}
             <div class="lineup-meta">
                 成型难度：${item.hard} &nbsp;
                 <span class="copy-code" data-code="${item.lineupCode}">
                    <span class="copy-normal">阵容码：${item.lineupCode}</span>
                    <span class="copy-success">✅已复制</span>
                 </span>
             </div>
         </div>
         <div class="lineup-bottom-row">
             <div class="lineup-rank">${item.rank}</div>
             <div class="player-group">
                 <div class="main-player">
                     <img src="${item.playerImg}" alt="">
                 </div>
                 ${alternatePlayerHtml}
             </div>
             <div class="hero-divider"></div>
             <div class="hero-row">
                 ${heroHtml}
             </div>
         </div>
     `;

            // 复制阵容码事件
            const copySpan = div.querySelector('.copy-code');
            copySpan.onclick = (e)=>{
                e.stopPropagation();
                copyCode(copySpan, item.lineupCode);
            }
            // 点击卡片打开弹窗
            div.onclick = ()=>{
                openLineupModal(item);
            }
            return div;
        }

        // 打开详情弹窗【完全复刻 lineup.html 弹窗模板】
        function openLineupModal(item){
            currentLineup = item;

            // 完整阵容英雄
            let heroHtml = '';
            if(Array.isArray(item.heroList)){
                heroHtml = item.heroList.map(h=>`
             <div class="mini-hero-modal ${h.isCore ? 'core' : ''}">
                 <img src="${h.img}" alt="${h.name}">
             </div>`
                ).join('');
            }

            // 功能替换卡
            let funcHeroHtml = '';
            if(Array.isArray(item.funcHeroList)){
                funcHeroHtml = item.funcHeroList.map(h=>`
             <div class="mini-hero-modal">
                 <img src="${h.img}" alt="${h.name}">
             </div>`
                ).join('');
            }

            // 备选英雄
            let backupHeroHtml = '';
            if(Array.isArray(item.backupHeroList)){
                backupHeroHtml = item.backupHeroList.map(h=>`
             <div class="mini-hero-modal">
                 <img src="${h.img}" alt="${h.name}">
             </div>`
                ).join('');
            }

           // 功能性英雄（新模块）
let functionalHeroHtml = '';
if(Array.isArray(item.funcHeroList) && item.funcHeroList.length>0){
    functionalHeroHtml = item.funcHeroList.map(h=>`
        <div class="func-hero-item">
            <img class="mini-hero-modal" src="${h.img}" alt="${h.name}">
            <div class="func-info">
                <div class="func-name">${h.name}</div>
                <div class="func-desc">${h.desc}</div>
            </div>
        </div>
    `).join('');
}else{
    functionalHeroHtml = `<p class="empty-text">暂无</p>`;
}


            // 首选装备
            let equipFirstHtml = '';
            if(Array.isArray(item.equipFirst)){
                equipFirstHtml = item.equipFirst.map(e=>`
             <div class="equip-pill">
                 <img src="${e.img}" alt="${e.name}">
             </div>`
                ).join('');
            }
            // 备选装备
            let equipSecondHtml = '';
            if(Array.isArray(item.equipSecond)){
                equipSecondHtml = item.equipSecond.map(e=>`
             <div class="equip-pill">
                 <img src="${e.img}" alt="${e.name}">
             </div>`
                ).join('');
            }

            // ========== 天赋卡片HTML ==========
            let talentTongCardHtml = '';
            if(Array.isArray(item.talentTong) && item.talentTong.length>0){
               talentTongCardHtml = item.talentTong.map(t=>`
            <div class="talent-card-full">
                <div class="talent-card-imgbox">
                    <img src="${t.img}" alt="${t.name}">
                </div>
                <div class="talent-card-name">${t.name}</div>
            </div>`).join('');
            }else{
                talentTongCardHtml = `<p class="empty-text">暂无</p>`;
            }
            let talentYinCardHtml = '';
            if(Array.isArray(item.talentYin) && item.talentYin.length>0){
                talentYinCardHtml = item.talentYin.map(t=>`
                <div class="talent-card-full">
                    <div class="talent-card-imgbox">
                        <img src="${t.img}" alt="${t.name}">
                    </div>
                    <div class="talent-card-name">${t.name}</div>
                </div>`).join('');
            }else{
                talentYinCardHtml = `<p class="empty-text">暂无</p>`;
            }
            let talentJinCardHtml = '';
            if(Array.isArray(item.talentJin) && item.talentJin.length>0){
                talentJinCardHtml = item.talentJin.map(t=>`
                <div class="talent-card-full">
                    <div class="talent-card-imgbox">
                        <img src="${t.img}" alt="${t.name}">
                    </div>
                    <div class="talent-card-name">${t.name}</div>
                </div>`).join('');
            }else{
                talentJinCardHtml = `<p class="empty-text">暂无</p>`;
            }

            // ========== 效果牌完整卡片 ==========
            let effectCardFullHtml = '';
            if(Array.isArray(item.effectCard) && item.effectCard.length>0){
                effectCardFullHtml = item.effectCard.map(e=>`
            <div class="effect-card-full">
                <div class="effect-card-imgbox">
                    <img src="${e.img}" alt="${e.name}">
                </div>
                <div class="effect-card-name">${e.name}</div>
            </div>`).join('');
            }else{
                effectCardFullHtml = `<p class="empty-text">暂无</p>`;
            }

            // 运营阶段
            let runStageHtml = '';
            if(Array.isArray(item.runStage)){
                runStageHtml = item.runStage.map(stage=>{
                    let stageHeroHtml = '';
                    if(Array.isArray(stage.heroList)){
                        stageHeroHtml = stage.heroList.map(h=>`
                     <div class="mini-hero-modal ${h.isCore ? 'core' : ''}">
                         <img src="${h.img}" alt="${h.name}">
                     </div>`
                        ).join('');
                    }
                    return `
             <div class="stage-block">
                 <div class="stage-title"><span class="run-stage-tag">${stage.title}</span></div>
                 <div class="stage-heroes">${stageHeroHtml || '<p class="empty-text">无</p>'}</div>
                 <p class="stage-desc">${stage.desc}</p>
             </div>
             `;
                }).join('');
            }

            // Ban阵营
            let banModalHtml = '';
            if(Array.isArray(item["ban位"]) && item["ban位"].length>0){
                banModalHtml = `
         <div class="modal-block">
             <h4>BAN阵营</h4>
             <div class="modal-sub">${item["ban位"].join("、")}</div>
         </div>`
            }

            // 注意事项列表渲染
            let noticeHtml = "";
            if(Array.isArray(item.notice) && item.notice.length > 0){
                noticeHtml = item.notice.map(n=>`<li>${n}</li>`).join("");
            }else{
                noticeHtml = `<li>无</li>`;
            }

            // 核心英雄信息
            const coreHero = item.heroList?.find(h=>h.isCore);

            modalInner.innerHTML = `
<span class="modal-close" onclick="closeModal();">×</span>
<div class="modal-top-info">
    <img class="player-avatar" src="${item.playerImg || ''}" alt="${item.player}">
    <div class="info-text">
        <div class="name-code-row">
            <h2>${item.name}</h2>
            <span class="code-text" onclick="copyCode(this, '${item.lineupCode || ''}')">
                <span class="code-normal">阵容码：${item.lineupCode || ''}</span>
                <span class="code-success">✅已复制</span>
            </span>
        </div>
        <div class="modal-sub">强度：${item.rank || ''} ｜ 成型难度：${item.hard || ''}</div>
    </div>
</div>
${banModalHtml}


            <div class="modal-block">
                <h4>阵容组成</h4>
                <div class="hero-row-modal">${heroHtml || '<p class="empty-text">暂无</p>'}</div>
            </div>

            <div class="modal-block">
                <h4>功能替换卡</h4>
                <div class="hero-row-modal">${funcHeroHtml || '<p class="empty-text">暂无</p>'}</div>
            </div>

            <div class="modal-block">
                <h4>备选英雄</h4>
                <div class="hero-row-modal">${backupHeroHtml || '<p class="empty-text">暂无</p>'}</div>
            </div>

            <div class="modal-block">
                <h4>功能性英雄</h4>
                <div class="func-hero-list">
                    ${functionalHeroHtml}
                </div>
            </div>

            <div class="equip-area">
                <div class="equip-area-title">装备选择</div>
                <div class="equip-main-row">
                    <div class="equip-main-hero">
                        <div class="mini-hero-modal core">
                            <img src="${coreHero?.img || ''}">
                        </div>
                        <span class="hero-name-text">${coreHero?.name || ''}</span>
                    </div>
                    <div class="equip-side">
                        <div class="equip-group">
                            <span class="equip-group-label">首选</span>
                            <div class="equip-list-row">${equipFirstHtml || '<p class="empty-text">暂无</p>'}</div>
                        </div>
                        <div class="equip-group">
                            <span class="equip-group-label">备选</span>
                            <div class="equip-list-row">${equipSecondHtml || '<p class="empty-text">暂无</p>'}</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-block">
                <h4>天赋推荐</h4>
                <div class="talent-board">
                    <div class="talent-three-col">
                        <div class="talent-col-block talent-col-tong">
                            <div class="talent-col-title">铜天赋</div>
                            <div class="talent-col-cards">${talentTongCardHtml}</div>
                        </div>
                        <div class="talent-col-block talent-col-yin">
                            <div class="talent-col-title">银天赋</div>
                            <div class="talent-col-cards">${talentYinCardHtml}</div>
                        </div>
                        <div class="talent-col-block talent-col-jin">
                            <div class="talent-col-title">金天赋</div>
                            <div class="talent-col-cards">${talentJinCardHtml}</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="modal-block">
                <h4>效果牌推荐</h4>
                <div class="effect-three-col">
                    ${effectCardFullHtml}
                </div>
            </div>

            <div class="modal-block">
                <h4>运营阶段</h4>
                <div class="run-stage-list">
                    ${runStageHtml || `<p class="empty-text">暂无运营攻略</p>`}
                </div>
            </div>

            <div class="modal-block">
                <h4>注意事项</h4>
                <ul class="notice-list">
                    ${noticeHtml}
                </ul>
            </div>

            <div class="modal-block">
                <h4>站位参考</h4>
                ${item.positionImage ? `
                    <div class="position-image-box">
                        <img src="${item.positionImage}">
                    </div>
                ` : '<p class="empty-text">暂无站位图</p>'}
            </div>
            `;
            modalDom.style.display = 'flex';
        }

        function renderHomeTopRank(){
            const wrap = document.getElementById('homeTopList');
            const idBox = document.getElementById('homeShowIdList');
            wrap.innerHTML = '';
            if(!idBox) return;

            const targetIds = idBox.innerText.split(',')
                .map(s=>Number(s.trim()))
                .filter(n=>!isNaN(n));

            targetIds.forEach(id=>{
                const item = lineupList.find(x=>x.id === id);
                if(!item) return;
                wrap.appendChild(buildCard(item));
            })
        }

        window.addEventListener('load', loadLineupJson);
    </script>
    <!-- 阵容弹窗【改成和lineup.html一致结构】 -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <div id="modalBody"></div>
    </div>
</div>

</div>
<!-- 解锁弹窗 -->
<div id="lockModal" style="position
