<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阵容大全 | 王者万象棋 - 万象一图诀</title>
    <base href="./">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #12161f;
            color: #e6e8ef;
            background-image: radial-gradient(circle at 40% 20%, rgba(204, 164, 79, 0.08), transparent 45%);
            min-height: 100vh;
        }

        /* 顶部导航 */
        .top-nav-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 20px;
            background-color: rgba(18, 22, 31, 0.75);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .top-nav-wrap a {
            text-decoration: none;
            color: #b4b9c6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .top-nav-wrap a:hover {
            color: #ffd369;
            background-color: rgba(255,211,105,0.08);
        }

        .top-nav-wrap a.active {
            color: #ffd369;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .page-title {
            font-size: 32px;
            text-align: center;
            margin-bottom: 24px;
            color: #ffd369;
        }

        /* 搜索框 */
        .search-box {
            display: flex;
            align-items: center;
            width: min(700px, 100%);
            margin: 0 auto 30px;
            background: #1c212c;
            border: 1px solid #333844;
            border-radius: 12px;
            padding: 12px 18px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e6e8ef;
            font-size: 16px;
            padding-left: 10px;
        }

        .search-box input::placeholder {
            color: #686e7c;
        }

        /* 阵容网格 */
        .lineup-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 18px;
        }

        /* 阵容卡片，和棋手卡片同风格 */
        .lineup-card {
            background: linear-gradient(135deg, #1c212c 0%, #272d3b 100%);
            border: 1px solid #333844;
            border-radius: 16px;
            overflow: hidden;
            transition: 0.3s;
            cursor: pointer;
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .lineup-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, #ffd369, #ff9f43);
            opacity: 0;
            transition: 0.3s;
        }

        .lineup-card:hover {
            border-color: rgba(255, 211, 105, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(255, 211, 105, 0.15);
        }

        .lineup-card:hover::before {
            opacity: 1;
        }

        /* 阵容头像区（放阵容预览图/占位） */
        .card-avatar {
            width: 90px;
            height: 90px;
            border-radius: 14px;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid #333844;
            background: #0f1218;
            position: relative;
        }

        .card-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .card-avatar .avatar-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: #ffd369;
            background: linear-gradient(135deg, #2a2f3c, #171a23);
        }

        /* 文字区 */
        .card-info {
            flex: 1;
            min-width: 0;
        }

        .card-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .card-name {
            font-size: 20px;
            font-weight: 700;
            color: #ffd369;
        }

        .card-role-tag {
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 12px;
            color: #12161f;
            background: #ffd369;
            font-weight: 700;
            white-space: nowrap;
        }

        .card-desc {
            font-size: 13px;
            color: #9aa0b0;
            line-height: 1.5;
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-buff {
            font-size: 13px;
            color: #c8cdd8;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .card-buff-label {
            color: #ffd369;
            font-weight: 700;
        }

        .card-buff-text {
            color: #b4b9c6;
        }

        /* 弹窗 完全复用棋手弹窗样式 */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            width: min(820px, 100%);
            background: #181c26;
            border: 1px solid #333844;
            border-radius: 20px;
            max-height: 86vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            float: right;
            color: #888;
            font-size: 26px;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-close:hover {
            color: #ffd369;
        }

        .modal h2 {
            color: #ffd369;
            margin-bottom: 10px;
            font-size: 26px;
        }

        .modal-sub {
            color: #9aa0b0;
            font-style: italic;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .modal-tag {
            display: inline-block;
            padding: 4px 10px;
            background: #ffd369;
            color: #12161f;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .modal-block {
            margin: 16px 0;
            background: #1c212c;
            border: 1px solid #282d38;
            border-radius: 14px;
            padding: 16px 18px;
        }

        .modal-block h4 {
            color: #ffd369;
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-block h4::before {
            content: "";
            width: 3px;
            height: 14px;
            background: #ffd369;
            border-radius: 2px;
        }

        .modal-block p {
            color: #b4b9c6;
            line-height: 1.8;
            font-size: 14px;
        }

        .champ-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .champ-item {
            background: #242a37;
            border: 1px solid #2f3544;
            border-radius: 10px;
            padding: 10px 12px;
        }

        .champ-item .tag {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(255, 211, 105, 0.14);
            color: #ffd369;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .champ-item p {
            color: #b4b9c6;
            line-height: 1.6;
            font-size: 13px;
        }

        /* 滚动条美化 */
        .modal-content::-webkit-scrollbar,
        .lineup-grid::-webkit-scrollbar {
            width: 8px;
        }

        .modal-content::-webkit-scrollbar-thumb,
        .lineup-grid::-webkit-scrollbar-thumb {
            background: #333844;
            border-radius: 4px;
        }

        .modal-content::-webkit-scrollbar-thumb:hover,
        .lineup-grid::-webkit-scrollbar-thumb:hover {
            background: #ffd369;
        }
    </style>
</head>
<body>
    <!-- 导航 -->
    <div class="top-nav-wrap">
        <a href="./index.html">首页</a>
        <a href="./lineup.html">阵容大全</a>
        <a href="./player.html">棋手</a>
        <a href="./hero-card.html">英雄牌</a>
        <a href="./talent.html">天赋牌</a>
        <a href="./equip.html">装备牌</a>
        <a href="./effect.html">效果牌</a>
        <a href="./info-gap.html">信息差</a>
    </div>

    <div class="container">
        <h2 class="page-title">阵容大全</h2>

        <div class="search-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#888e9c">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input id="searchInput" type="text" placeholder="搜索阵容名称、羁绊、核心英雄、关键词...">
        </div>

        <div class="lineup-grid" id="lineupGrid"></div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <span class="modal-close" id="closeModal">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="./app.js"></script>
    <script>
    // 导航自动高亮脚本，和所有页面统一
    (function(){
      const navLinks = document.querySelectorAll('.top-nav-wrap a');
      const currentPath = location.pathname.split('/').pop() || 'index.html';
      navLinks.forEach(link => {
        link.classList.remove('active');
        const href = link.getAttribute('href').replace('./','');
        if(href === currentPath){
          link.classList.add('active');
        }
      })
    })();
    </script>
</body>
</html>
