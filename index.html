<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>王者万象棋 - 万象一图诀</title>
    <base href="./">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #12161f;
            color: #e6e8ef;
            background-image: radial-gradient(circle at 40% 20%, rgba(204, 164, 79, 0.08), transparent 45%);
            min-height: 100vh;
        }
        /* 顶部导航栏 */
        .top-nav-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 20px;
            background-color: rgba(18, 22, 31, 0.75);
            backdrop-filter: blur(10px);
            position: sticky;
            top:0;
            z-index:99;
        }
        .top-nav-wrap a {
            text-decoration: none;
            color: #b4b9c6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }
        .top-nav-wrap a:hover {
            color: #ffd369;
            background-color: rgba(255,211,105,0.08);
        }
        .top-nav-wrap a.active {
            color: #ffd369;
            position: relative;
        }
        /* 加上底部黄色下划线，和你截图效果一致 */
        .top-nav-wrap a.active::after{
            content:'';
            position:absolute;
            left:16px;
            right:16px;
            bottom:-4px;
            height:4px;
            background:#ffd369;
            border-radius:99px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        .subtitle-tag {
            color: #b8a060;
            letter-spacing: 4px;
            font-size:14px;
            margin-bottom:12px;
        }
        h1 {
            font-size: 64px;
            line-height: 1.2;
            font-weight: 600;
        }
        .yellow-text {
            color: #ffd369;
        }
        .desc-line {
            color:#9298a6;
            margin:14px 0 40px;
            font-size:14px;
        }
        /* 搜索框 */
        .search-box {
            display:flex;
            align-items:center;
            width: min(900px, 100%);
            margin:0 auto 40px;
            background: #1c212c;
            border: 1px solid #333844;
            border-radius:12px;
            padding:14px 20px;
        }
        .search-box input {
            flex:1;
            background:transparent;
            border:none;
            outline:none;
            color:#e6e8ef;
            font-size:16px;
            padding-left:10px;
        }
        .search-box input::placeholder {
            color:#686e7c;
        }
        .search-hint {
            color:#686e7c;
            font-size:13px;
            margin-bottom:50px;
        }
        /* ========== 横向滚动卡面容器，只保留图片卡牌 ========== */
        .quick-card-group {
            display: flex;
            gap: 22px;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 20px 10px;
            scroll-behavior: smooth;
            /* 隐藏滚动条 */
            scrollbar-width: none;
            justify-content: center;
        }
        .quick-card-group::-webkit-scrollbar {
            display: none;
        }
        .quick-card {
            flex: 0 0 120px;
            background: #1c212c;
            border: 1px solid #282d38;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .quick-card:hover {
            transform: translateY(-8px) scale(1.04);
            border-color:rgba(255,211,105,0.45);
            box-shadow: 0 8px 20px rgba(255, 211, 105, 0.12);
        }
        .quick-card-cover img {
            width: 96px;
            height:96px;
            border-radius: 8px;
            object-fit: cover;
        }
    </style>
</head>
<body>
<!-- ========= 重点：mainContent 不再 display:none，默认直接显示 ========= -->
<div id="mainContent">
    <!-- 顶部导航 -->
    <div class="top-nav-wrap">
        <a href="./index.html">首页</a>
        <a href="./lineup.html">阵容大全</a>
        <a href="./player.html">棋手</a>
        <a href="./hero-card.html">英雄牌</a>
        <a href="./talent.html">天赋牌</a>
        <a href="./equip.html">装备牌</a>
        <a href="./effect.html">效果牌</a>
        <a href="./info-gap.html">信息差</a>
    </div>
    <div class="container">
        <div class="subtitle-tag">WANGZHE WANXIANGQI</div>
<h1>致力于做王者万象棋最全攻略
<br>
<span class="yellow-text">万象棋启动</span>
</h1>
<div class="desc-line">万象一图诀 · 友情打造</div>
        <div class="search-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#888e9c">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" placeholder="搜索棋手、英雄牌、装备牌、效果牌...">
            <span style="color:#777; font-size:13px;">⌘ K</span>
        </div>
        <div class="search-hint">支持拼音与首字母 · 覆盖全部游戏资料 · 数据持续更新</div>
             <!-- 纯卡牌，无名字、无描述 -->
        <div class="quick-card-group">
            <div class="quick-card" data-type="hero" data-id="1">
                <div class="quick-card-cover">
                    <img src="images/herocard/sunshangxiang.png" alt="孙尚香">
                </div>
            </div>
            <div class="quick-card" data-type="hero" data-id="2">
                <div class="quick-card-cover">
                    <img src="images/herocard/sunbin.png" alt="孙膑">
                </div>
            </div>
            <div class="quick-card" data-type="hero" data-id="3">
                <div class="quick-card-cover">
                    <img src="images/herocard/niumo.png" alt="牛魔">
                </div>
            </div>
            <div class="quick-card" data-type="hero" data-id="4">
                <div class="quick-card-cover">
                    <img src="images/herocard/liyuanfang.png" alt="李元芳">
                </div>
            </div>
        </div>
    </div>
    <script src="./app.js"></script>
    <!-- 导航自动高亮脚本 -->
    <script>
    (function(){
      const navLinks = document.querySelectorAll('.top-nav-wrap a');
      const currentPath = location.pathname.split('/').pop() || 'index.html';
      navLinks.forEach(link => {
        link.classList.remove('active');
        const href = link.getAttribute('href').replace('./','');
        if(href === currentPath){
          link.classList.add('active');
        }
      })
    })();
    </script>
            <script>
        const cards = document.querySelectorAll('.quick-card');
        cards.forEach(card => {
            card.addEventListener('click', () => {
                const type = card.dataset.type;
                const id = card.dataset.id;
                console.log('点击卡片', type, id);
                // 以后在这里写跳转逻辑
            });
        })
    </script>
</div>

<!-- 【解锁遮罩弹窗，浮在首页上面】 -->
<div id="lockModal" style="position:fixed;inset:0;background:rgba(0,0,0,0.3);z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div style="background:rgba(31, 41, 55, 0.92);backdrop-filter: blur(6px);padding:32px;border-radius:16px;text-align:center;color:#fff;max-width:360px;">
    <h3 style="margin:0 0 16px;">🔒 内容解锁</h3>
    <p style="margin:0 0 12px;font-size:14px;">扫码关注公众号，回复【验证码】获取解锁码</p>
    <img src="./images/wanxiangyitujue.jpg" alt="公众号二维码" style="width:220px;margin-bottom:16px;border-radius:8px;">
    <input id="codeInput" type="text" placeholder="请输入解锁验证码" style="width:100%;padding:10px;border-radius:8px;border:none;margin-bottom:12px;font-size:16px;">
    <br>
    <button id="unlockBtn" style="padding:10px 24px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:16px;">确认解锁</button>
    <p id="tipText" style="color:#f87171;margin-top:12px;font-size:14px;display:none;">验证码错误，请重新获取！</p>
  </div>
</div>

<script>
const RIGHT_CODE = "万象一图诀";
const lockModal = document.getElementById('lockModal');
const codeInput = document.getElementById('codeInput');
const unlockBtn = document.getElementById('unlockBtn');
const tipText = document.getElementById('tipText');

// 读取本地缓存，已经解锁直接隐藏弹窗
if(localStorage.getItem('wanxiang_unlock') === 'ok'){
  lockModal.style.display = 'none';
}

unlockBtn.onclick = function(){
  const val = codeInput.value.trim();
  if(val === RIGHT_CODE){
    lockModal.style.display = 'none';
    localStorage.setItem('wanxiang_unlock','ok');
  }else{
    tipText.style.display = 'block';
  }
}
// 回车也可以提交
codeInput.addEventListener('keydown',function(e){
  if(e.key === 'Enter') unlockBtn.click();
})
</script>
</body>
</html>
