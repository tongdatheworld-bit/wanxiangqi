<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阵容大全 - 王者万象棋</title>
    <base href="./">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <nav class="nav">
        <a href="./index.html">首页</a>
        <a href="./hero.html">英雄图鉴</a>
        <a href="./lineup.html" class="active">阵容大全</a>
    </nav>
    <div class="container">
        <h1>阵容大全</h1>
        <p>浏览热门阵容，一键复制阵容码</p>
        <!-- 双筛选 -->
        <div class="filter-bar" style="margin:16px 0;display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
            <div style="display:flex;gap:6px;align-items:center;">
                <label>棋手：</label>
                <select id="playerFilter" style="padding:4px 8px;">
                    <option value="">全部棋手</option>
                </select>
            </div>
            <div style="display:flex;gap:6px;align-items:center;">
                <label>评级：</label>
                <select id="levelFilter" style="padding:4px 8px;">
                    <option value="">全部评级</option>
                    <option value="S+">S+</option>
                    <option value="S">S</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                </select>
            </div>
            <span id="resultCount"></span>
        </div>

        <div id="lineup-list" class="card-wrap">
            <!-- JS渲染阵容卡片 -->
        </div>
    </div>
    <script src="./app.js"></script>
</body>
</html>
