<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万象一图诀-阵容大全</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
    background-color: #12161f;
    color: #e6e8ef;
    background-image: radial-gradient(circle at 40% 20%, rgba(204, 164, 79, 0.08), transparent 45%);
    min-height: 100vh;
}

/* 顶部导航 */
.top-nav-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 16px 20px;
    background-color: rgba(18, 22, 31, 0.75);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 99;
}

.top-nav-wrap a {
    text-decoration: none;
    color: #b4b9c6;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 15px;
    transition: all 0.2s;
}

.top-nav-wrap a:hover {
    color: #ffd369;
    background-color: rgba(255,211,105,0.08);
}

.top-nav-wrap a.active {
    color: #ffd369;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px;
}

.page-title {
    font-size: 32px;
    text-align: center;
    margin-bottom: 24px;
    color: #ffd369;
}

/* 搜索框 */
.search-box {
    display: flex;
    align-items: center;
    width: 100%;
    margin: 0 auto 20px;
    background: #1c212c;
    border: 1px solid #333844;
    border-radius: 12px;
    padding: 12px 18px;
}

.search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #e6e8ef;
    font-size: 16px;
    padding-left: 10px;
}

.search-box input::placeholder {
    color: #686e7c;
}

/* 筛选区 */
.filter-wrap {
    margin-bottom: 24px;
}
.filter-row {
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}
.filter-label{
    color:#9aa0b0;
    width:50px;
}
.filter-chip{
    padding:6px 12px;
    border-radius:8px;
    background:#1c212c;
    border:1px solid #333844;
    color:#b4b9c6;
    cursor:pointer;
    transition:0.2s;
}
.filter-chip.active{
    border-color:#ffd369;
    color:#ffd369;
    background:rgba(255,211,105,0.08);
}

/* ========== 棋手筛选栏样式 ========== */
.filter-row:first-child .filter-chip.player-chip {
    width: 84px;
    height: 84px;
    padding: 0;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    border: 2px solid #333844;
    background: #1c212c;
    transition: 0.2s ease;
}
.filter-row:first-child .filter-chip.player-chip img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
.filter-row:first-child .filter-chip.player-chip:hover {
    transform: scale(1.08);
}
.filter-row:first-child .filter-chip.player-chip.active {
    border-color:#ffd369;
    box-shadow:  0  0  0  2px rgba(255,211,105,0.35), 0  0  10px rgba(255,211,105,0.45);
}
.filter-row:first-child .filter-chip.player-chip-all {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    height: 84px;
    padding: 0 20px;
    border-radius: 14px;
    border: 2px solid #333844;
    background: #1c212c;
    flex-shrink: 0;
    font-size: 20px;
    color: #b4b9c6;
    cursor: pointer;
    transition: 0.2s ease;
    white-space: nowrap;
}
.filter-row:first-child .filter-chip.player-chip-all span {
    display: inline-block;
    line-height: 1;
    transform: translateY(-1px);
}
.filter-row:first-child .filter-chip.player-chip-all:hover {
    transform: scale(1.08);
}
.filter-row:first-child .filter-chip.player-chip-all.active {
    border-color: #ffd369;
    color: #ffd369;
    background: rgba(255,211,105,0.08);
    box-shadow: 0  0  0  2px rgba(255,211,105,0.35), 0  0  10px rgba(255,211,105,0.45);
}
.filter-row:first-child {
    overflow-x: auto;
    overflow-y: hidden;
    flex-wrap: nowrap;
    padding: 6px 0 12px 0;
    border-bottom: 1px solid #2c313f;
    gap: 16px;
    align-items: center;
}
.filter-row:first-child::-webkit-scrollbar {
    height: 4px;
}
.filter-row:first-child::-webkit-scrollbar-track {
    background: #12161f;
}
.filter-row:first-child::-webkit-scrollbar-thumb {
    background: #333844;
    border-radius: 2px;
}

.reset-btn{
    margin-left:auto;
    padding:6px 14px;
    border-radius:8px;
    background:#1c212c;
    border:1px solid #333844;
    color:#b4b9c6;
    cursor:pointer;
}
.reset-btn:hover{
    color:#ffd369;
    border-color:#ffd369;
}

/* ===================== 阵容卡片【修改后：头像在上，文字全部在下】 ===================== */
.lineup-list {
    display: flex;
    flex-direction: column;
    gap:16px;
}

.lineup-card {
    background: linear-gradient(135deg, #1c212c 0%, #272d3b 100%);
    border: 1px solid #333844;
    border-radius: 16px;
    transition: 0.3s;
    cursor: pointer;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
}

.lineup-card:hover {
    border-color: rgba(255, 211, 105, 0.5);
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(255, 211, 105, 0.15);
}

/* 上半区：S等级 + 英雄头像一行 */
.card-top {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 10px;
}
.card-bottom {
    width: 100%;
}

/* 隐藏卡片里的棋手头像 */
.lineup-avatar {
    display: none;
}

.lineup-rank{
    width:54px;
    height:54px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background: #7b3fd8;
    border-radius:10px;
    font-weight:bold;
    font-size:20px;
    color:#fff;
}

.hero-row{
    display:flex;
    gap:6px;
    align-items:center;
    flex-wrap: nowrap;
    overflow-x:auto;
    padding-bottom: 4px;
}
.mini-hero{
    width:42px;
    height:42px;
    border-radius:8px;
    border:1px solid #333844;
    position:relative;
}
.mini-hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.mini-hero.core::after{
    content:"核";
    position:absolute;
    top:-4px;
    right:-4px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:#7b3fd8;
    color:#fff;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* 文字区域，全部缩小 */
.lineup-info{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom: 4px;
}
.lineup-name{
    font-size: 15px;
    font-weight:700;
    color:#ffd369;
}
.tag{
    padding:2px 6px;
    border-radius:5px;
    font-size:10px;
    background:rgba(255,211,105,0.12);
    color:#ffd369;
}
.lineup-meta{
    font-size:11px;
    color:#9aa0b0;
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}
.arrow{
    color:#9aa0b0;
    font-size:22px;
    padding:0 8px;
}

/* 弹窗 */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
    backdrop-filter: blur(4px);
}

.modal-content {
    width: min(820px, 100%);
    background: #181c26;
    border: 1px solid #333844;
    border-radius: 20px;
    max-height: 86vh;
    overflow-y: auto;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.modal-close {
    float: right;
    color: #888;
    font-size: 26px;
    cursor: pointer;
    transition: 0.2s;
}

.modal-close:hover {
    color: #ffd369;
}

.modal h2 {
    color: #ffd369;
    margin-bottom: 10px;
    font-size: 26px;
}
.modal-sub{
    color:#9aa0b0;
    margin-bottom:16px;
}
.modal-block {
    margin: 16px 0;
    background: #1c212c;
    border: 1px solid #282d38;
    border-radius: 14px;
    padding: 16px 18px;
}

.modal-block h4 {
    color: #ffd369;
    margin-bottom: 8px;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.modal-block h4::before {
    content: "";
    width: 3px;
    height: 14px;
    background: #ffd369;
    border-radius: 2px;
}

.modal-block p {
    color: #b4b9c6;
    line-height: 1.8;
    font-size: 14px;
}
.link-official{
    display:inline-block;
    margin-top:10px;
    padding:8px 14px;
    background:#7b3fd8;
    color:#fff;
    border-radius:8px;
    text-decoration:none;
}
.link-official:hover{
    opacity:0.9;
}

.modal-content::-webkit-scrollbar {
    width: 8px;
}
.modal-content::-webkit-scrollbar-thumb {
    background: #333844;
    border-radius: 4px;
}
.modal-content::-webkit-scrollbar-thumb:hover {
    background: #ffd369;
}
</style>
</head>
<body>
<div class="top-nav-wrap">
    <a href="#" class="active">全部阵容</a>
    <a href="#">S+</a>
    <a href="#">S</a>
</div>
<div class="container">
    <h1 class="page-title">万象棋阵容库</h1>
    <div class="search-box">
        <input id="searchInput" placeholder="搜索阵容名称、棋手..." />
    </div>
    <div class="filter-wrap">
        <div class="filter-row">
            <span class="filter-label">棋手</span>
            <div id="playerFilter"></div>
            <div class="reset-btn">重置</div>
        </div>
    </div>
    <div class="lineup-list" id="listWrap"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="modal-close">&times;</span>
        <h2 id="modalTitle"></h2>
        <div class="modal-sub" id="modalSub"></div>
        <div class="modal-block" id="modalBody"></div>
    </div>
</div>

<script>
const data = [
    {
        "id": 1,
        "name": "无限复活花木兰",
        "rank": "S+",
        "player": "嬴律",
        "playerImg": "images/players/yinlv.png",
        "hard": "中等",
        "lineupCode": "38337677766581410",
        "ban位": ["逐鹿", "大河流", "三分"],
        "heroList": [
            {"name":"花木兰","img":"images/heroes/huamulan.png","isCore":true},
            {"name":"武则天","img":"images/heroes/wuzetian.png","isCore":false},
            {"name":"李白","img":"images/heroes/libai.png","isCore":false},
            {"name":"上官婉儿","img":"images/heroes/shangguanwaner.png","isCore":false},
            {"name":"程咬金","img":"images/heroes/chenyaojin.png","isCore":false},
            {"name":"钟馗","img":"images/heroes/zhongkui.png","isCore":false},
            {"name":"露娜","img":"images/heroes/luna.png","isCore":false}
        ],
        "equip": [
            {"name":"贤者的庇护","img":"images/equip/fuhuo.png"}
        ]
    },
    {
        "id": 2,
        "name": "日落海司空震",
        "rank": "S+",
        "player": "玉环",
        "playerImg": "images/players/yuhuan.png",
        "hard": "困难",
        "lineupCode": "76616412643475690",
        "ban位": ["日落海"],
        "heroList": [],
        "equip": []
    },
    {
        "id": 3,
        "name": "孙膑三分体系",
        "rank": "S+",
        "player": "孙小宾",
        "playerImg": "images/players/sunxiaobin.png",
        "hard": "中等",
        "lineupCode": "77743464511520968",
        "ban位": ["逐鹿", "大河流", "河洛"],
        "heroList": [],
        "equip": []
    },
    {
        "id": 4,
        "name": "昭君河洛5+2",
        "rank": "S+",
        "player": "昭君",
        "playerImg": "images/players/zhaojun.png",
        "hard": "中等",
        "lineupCode": "30456997313626170",
        "ban位": ["逐鹿", "河洛", "三分", "日落海"],
        "heroList": [],
        "equip": []
    },
    {
        "id": 5,
        "name": "昭君75速冲",
        "rank": "S+",
        "player": "昭君",
        "playerImg": "images/players/zhaojun.png",
        "hard": "中等",
        "lineupCode": "94633913646845962",
        "ban位": ["逐鹿", "河洛", "日落海"],
        "heroList": [],
        "equip": []
    },
    {
        "id": 6,
        "name": "低阶龙蛇",
        "rank": "S",
        "player": "昭君",
        "playerImg": "images/players/zhaojun.png",
        "hard": "中等",
        "lineupCode": "119403711597433866",
        "ban位": ["逐鹿", "河洛", "三分", "日落海"],
        "heroList": [],
        "equip": []
    }
];

const listWrap = document.getElementById('listWrap');
const playerFilter = document.getElementById('playerFilter');
const searchInput = document.getElementById('searchInput');
const modal = document.getElementById('modal');
const modalClose = document.querySelector('.modal-close');
const modalTitle = document.getElementById('modalTitle');
const modalSub = document.getElementById('modalSub');
const modalBody = document.getElementById('modalBody');
const resetBtn = document.querySelector('.reset-btn');

let activePlayer = '';

// 去重棋手列表
const playerSet = [...new Set(data.map(item=>item.player))];
playerSet.forEach(p=>{
    const div = document.createElement('div');
    div.className = 'filter-chip player-chip';
    div.innerHTML = `<img src="${data.find(x=>x.player===p).playerImg}" alt="${p}" />`;
    div.title = p;
    div.onclick = ()=>{
        activePlayer = activePlayer === p ? '' : p;
        render();
    }
    playerFilter.appendChild(div);
})

function render(){
    let html = '';
    let filterData = data;
    if(activePlayer){
        filterData = filterData.filter(x=>x.player === activePlayer);
    }
    const kw = searchInput.value.trim().toLowerCase();
    if(kw){
        filterData = filterData.filter(x=> x.name.toLowerCase().includes(kw) || x.player.toLowerCase().includes(kw))
    }

    filterData.forEach(item=>{
        let heroHtml = '';
        item.heroList.forEach(h=>{
            heroHtml += `
                <div class="mini-hero ${h.isCore?'core':''}">
                    <img src="${h.img}" alt="${h.name}" />
                </div>
            `
        })
        if(!heroHtml) heroHtml = `<span style="color:#777;">暂未更新</span>`;

        const banTag = item.ban位.map(b=>`<span class="tag">${b}</span>`).join('');

        html += `
        <div class="lineup-card" data-id="${item.id}">
            <div class="card-top">
                <div class="lineup-rank">${item.rank}</div>
                <div class="hero-row">
                    ${heroHtml}
                </div>
            </div>
            <div class="card-bottom">
                <div class="lineup-info">
                    <span class="lineup-name">${item.name}</span>
                    ${banTag}
                </div>
                <div class="lineup-meta">
                    棋手：${item.player}｜难度：${item.hard}｜代码：${item.lineupCode}
                </div>
            </div>
        </div>
        `
    })
    listWrap.innerHTML = html;

    // 卡片点击弹窗
    document.querySelectorAll('.lineup-card').forEach(card=>{
        card.onclick = ()=>{
            const d = data.find(x=>x.id == card.dataset.id);
            modalTitle.innerText = d.name;
            modalSub.innerText = `棋手：${d.player}｜难度：${d.hard}｜编码：${d.lineupCode}`;
            modalBody.innerHTML = `
                <p>ban位：${d.ban位.join('、')}</p>
            `;
            modal.style.display = 'flex';
        }
    })
}

modalClose.onclick = ()=> modal.style.display = 'none';
modal.onclick = (e)=>{
    if(e.target === modal) modal.style.display = 'none';
}
resetBtn.onclick = ()=>{
    activePlayer = '';
    searchInput.value = '';
    render();
}
searchInput.oninput = render;

render();
</script>
</body>
</html>
