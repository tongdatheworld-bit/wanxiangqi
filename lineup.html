<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阵容大全 | 王者万象棋 - 万象一图诀</title>
    <base href="./">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #12161f;
            color: #e6e8ef;
            background-image: radial-gradient(circle at 40% 20%, rgba(204, 164, 79, 0.08), transparent 45%);
            min-height: 100vh;
        }

        /* 顶部导航 */
        .top-nav-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 20px;
            background-color: rgba(18, 22, 31, 0.75);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .top-nav-wrap a {
            text-decoration: none;
            color: #b4b9c6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .top-nav-wrap a:hover {
            color: #ffd369;
            background-color: rgba(255,211,105,0.08);
        }

        .top-nav-wrap a.active {
            color: #ffd369;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .page-title {
            font-size: 32px;
            text-align: center;
            margin-bottom: 24px;
            color: #ffd369;
        }

        /* 搜索框 */
        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 0 auto 20px;
            background: #1c212c;
            border: 1px solid #333844;
            border-radius: 12px;
            padding: 12px 18px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e6e8ef;
            font-size: 16px;
            padding-left: 10px;
        }

        .search-box input::placeholder {
            color: #686e7c;
        }

        /* 筛选区 */
        .filter-wrap {
            margin-bottom: 24px;
        }
        .filter-row {
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:12px;
        }
        .filter-label{
            color:#9aa0b0;
            width:50px;
            flex-shrink:0;
        }
        .filter-group-inner{
            display:flex;
            align-items:center;
            gap:10px;
            flex:1;
        }
        /* 【普通文字筛选按钮：强度、阵营 保持原样】 */
        .filter-chip{
            padding:6px 12px;
            border-radius:8px;
            background:#1c212c;
            border:1px solid #333844;
            color:#b4b9c6;
            cursor:pointer;
            transition:0.2s;
            white-space:nowrap;
        }
        .filter-chip.active{
            border-color:#ffd369;
            color:#ffd369;
            background:rgba(255,211,105,0.08);
        }
        /* ========== 棋手头像单独覆盖样式 ========== */
        .player-chip {
            all: unset;
            display: block;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid #333844;
            background: #1c212c;
            cursor: pointer;
        }
        .player-chip img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .player-chip.active {
            border-color:#ffd369;
            box-shadow: 0  0  6px rgba(255,211,105,0.25);
        }
        /* 棋手那一行开启横向滚动，不再换行 */
        .filter-row.player-row {
            overflow-x: auto;
            overflow-y: hidden;
            flex-wrap: nowrap;
            padding: 6px 0;
        }
        .filter-row.player-row::-webkit-scrollbar {
            height: 4px;
        }
        .filter-row.player-row::-webkit-scrollbar-track {
            background: #12161f;
        }
        .filter-row.player-row::-webkit-scrollbar-thumb {
            background: #333844;
            border-radius: 2px;
        }
        .reset-btn{
            margin-left:auto;
            padding:6px 14px;
            border-radius:8px;
            background:#1c212c;
            border:1px solid #333844;
            color:#b4b9c6;
            cursor:pointer;
            white-space:nowrap;
        }
        .reset-btn:hover{
            color:#ffd369;
            border-color:#ffd369;
        }

        /* 阵容列表 */
        .lineup-list {
            display: flex;
            flex-direction: column;
            gap:16px;
        }

        /* 阵容卡片（横向长条卡片，和截图一致） */
        .lineup-card {
            background: linear-gradient(135deg, #1c212c 0%, #272d3b 100%);
            border: 1px solid #333844;
            border-radius: 16px;
            transition: 0.3s;
            cursor: pointer;
            padding:16px;
            display:flex;
            align-items:center;
            gap:16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .lineup-card:hover {
            border-color: rgba(255, 211, 105, 0.5);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 211, 105, 0.15);
        }

        /* 棋手头像 */
        .lineup-avatar {
            width:64px;
            height:64px;
            border-radius:12px;
            flex-shrink:0;
            border:2px solid #333844;
            overflow:hidden;
        }
        .lineup-avatar img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        /* 强度方块 */
        .lineup-rank{
            width:54px;
            height:54px;
            flex-shrink:0;
            display:flex;
            align-items:center;
            justify-content:center;
            background: #7b3fd8;
            border-radius:10px;
            font-weight:bold;
            font-size:20px;
            color:#fff;
        }

        .lineup-main{
            flex:1;
            min-width:0;
        }
        .lineup-top{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:6px;
        }
        .lineup-name{
            font-size:20px;
            font-weight:700;
            color:#ffd369;
        }
        .tag{
            padding:3px 8px;
            border-radius:6px;
            font-size:12px;
            background:rgba(255,211,105,0.12);
            color:#ffd369;
        }
        .lineup-meta{
            font-size:12px;
            color:#9aa0b0;
            margin-bottom:8px;
            display:flex;
            flex-wrap:wrap;
            gap:8px;
        }
        .hero-row{
            display:flex;
            gap:6px;
            align-items:center;
        }
        .mini-hero{
            width:64px;
            height:64px;
            border-radius:8px;
            border:1px solid #333844;
            position:relative;
        }
        .mini-hero img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .mini-hero.core::after{
            content:"核";
            position:absolute;
            top:-4px;
            right:-4px;
            width:18px;
            height:18px;
            border-radius:50%;
            background:#7b3fd8;
            color:#fff;
            font-size:10px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .arrow{
            color:#9aa0b0;
            font-size:22px;
            padding:0 8px;
        }

        /* 弹窗 */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            width: min(820px, 100%);
            background: #181c26;
            border: 1px solid #333844;
            border-radius: 20px;
            max-height: 86vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            float: right;
            color: #888;
            font-size: 26px;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-close:hover {
            color: #ffd369;
        }

        .modal h2 {
            color: #ffd369;
            margin-bottom: 10px;
            font-size: 26px;
        }
        .modal-sub{
            color:#9aa0b0;
            margin-bottom:16px;
        }
        .modal-block {
            margin: 16px 0;
            background: #1c212c;
            border: 1px solid #282d38;
            border-radius: 14px;
            padding: 16px 18px;
        }

        .modal-block h4 {
            color: #ffd369;
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-block h4::before {
            content: "";
            width: 3px;
            height: 14px;
            background: #ffd369;
            border-radius: 2px;
        }

        .modal-block p {
            color: #b4b9c6;
            line-height: 1.8;
            font-size: 14px;
        }
        .link-official{
            display:inline-block;
            margin-top:10px;
            padding:8px 14px;
            background:#7b3fd8;
            color:#fff;
            border-radius:8px;
            text-decoration:none;
        }
        .link-official:hover{
            opacity:0.9;
        }

        /* 滚动条美化 */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: #333844;
            border-radius: 4px;
        }
        .modal-content::-webkit-scrollbar-thumb:hover {
            background: #ffd369;
        }

        /* ========= 弹窗详情内英雄行 ========= */
        .hero-row-modal{
            display:flex;
            gap:8px;
            margin:10px 0;
            flex-wrap:wrap;
        }
        .mini-hero-modal{
            width:64px;
            height:64px;
            border-radius:8px;
            border:1px solid #333844;
            position:relative;
            overflow: hidden;
        }
        .mini-hero-modal img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .mini-hero-modal.core::after{
            content:"核";
            position:absolute;
            top:-4px;
            right:-4px;
            width:20px;
            height:20px;
            border-radius:50%;
            background:#7b3fd8;
            color:#fff;
            font-size:11px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        /* ========= 装备行 ========= */
        .equip-row{
            display:flex;
            gap:12px;
            align-items:center;
            margin:10px 0;
            flex-wrap:wrap;
        }
        .equip-item{
            text-align:center;
            width:70px;
        }
        .equip-item img{
            width:54px;
            height:54px;
            border-radius:8px;
            border:1px solid #333844;
        }
        .equip-item span{
            display:block;
            font-size:12px;
            color:#b4b9c6;
            margin-top:4px;
        }
        .equip-tag{
            color:#ffd369;
            font-weight:bold;
            width:40px;
        }

        /* ========= 站位矩阵Grid ========= */
        .pos-matrix-wrap{
            margin-top:10px;
        }
        .pos-grid{
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            background: #1b142b;
            padding:16px;
            border-radius:14px;
            border: 1px solid #7b3fd877;
        }
        .pos-cell{
            aspect-ratio: 1 / 1;
            border-radius:10px;
            border: 2px solid #7b3fd855;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            background:#241a3b44;
        }
        .pos-cell.has-hero{
            border-color:#7b3fd8;
        }
        .pos-cell img{
            width:80%;
            height:80%;
            object-fit:cover;
            border-radius:8px;
        }

        /* ========= 弹窗头部信息行 ========= */
        .modal-top-info{
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:16px;
        }
        .modal-top-info img{
            width:72px;
            height:72px;
            border-radius:50%;
            object-fit:cover;
        }
        .top-tags-wrap{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .top-tag{
            padding:4px 10px;
            background:#1c212c;
            border:1px solid #333844;
            border-radius:6px;
            font-size:14px;
            color:#b4b9c6;
        }
        /* ========= 运营节奏模块【新增】 ========= */
.run-stage-list{
    display:flex;
    flex-direction:column;
    gap:14px;
}
.run-stage-item{
    background:#1c212c;
    border:1px solid #282d38;
    border-radius:14px;
    padding:16px 18px;
}
.run-stage-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:15px;
}
/* 阶段显眼标签：1-3回合 /4-11 /12回合以后 */
.run-stage-tag{
    display:inline-block;
    padding:5px 14px;
    border-radius:8px;
    background:linear-gradient(135deg,#ffd369,#ffb020);
    color:#12161f;
    font-size:14px;
    font-weight:800;
    box-shadow:0 4px 10px rgba(255,176,32,0.35);
    letter-spacing:1px;
}
.run-stage-heros{
    display:flex;
    gap:12px;
    margin-bottom:10px;
    flex-wrap:wrap;
}
/* 运营节奏头像 64×64 */
.run-stage-hero{
    width:64px;
    height:64px;
    border-radius:10px;
    border:1px solid #333844;
    overflow:hidden;
    position:relative;
}
.run-stage-hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}
/* 隐藏英雄名字 */
.run-stage-hero-name{
    display:none;
}
.run-stage-text{
    color:#b4b9c6;
    line-height:1.8;
    font-size:14px;
}
        /* ========= 运营节奏样式（匹配你当前class） ========= */
.stage-block {
    background:#1c212c;
    border:1px solid #282d38;
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:14px;
}
.stage-title {
    margin-bottom:10px;
}
.run-stage-tag{
    display:inline-block;
    padding:5px 14px;
    border-radius:8px;
    background:linear-gradient(135deg,#ffd369,#ffb020);
    color:#12161f;
    font-size:14px;
    font-weight:800;
    box-shadow:0 4px 10px rgba(255,176,32,0.35);
    letter-spacing:1px;
}
.stage-heroes{
    display:flex;
    gap:12px;
    margin-bottom:10px;
    flex-wrap:wrap;
}
.hero-pill.small{
    width:64px;
    height:64px;
    border-radius:10px;
    border:1px solid #333844;
    overflow:hidden;
    display:block;
}
.hero-pill.small img{
    width:100%;
    height:100%;
    object-fit:cover;
}
.stage-desc{
    color:#b4b9c6;
    line-height:1.8;
    font-size:14px;
}
.empty-text{
    color:#777;
    font-size:13px;
}

        /* 阵容码复制hover */
        .copy-code{
            cursor: pointer;
        }
        .copy-code:hover{
            color:#ffd369;
        }
    </style>
</head>

                    <div class="filter-chip" data-filter="camp" data-val="逐鹿">逐鹿</div>
                    <div class="filter-chip" data-filter="camp" data-val="大河流">大河流</div>
                    <div class="filter-chip" data-filter="camp" data-val="日落海">日落海</div>
                    <button class="reset-btn" id="resetFilter">重置</button>
                </div>
            </div>
        </div>

        <div class="lineup-list" id="lineupList" style="visibility:hidden;"></div>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <span class="modal-close" id="closeModal">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        //导航高亮
        (function(){
          const navLinks = document.querySelectorAll('.top-nav-wrap a');
          const currentPath = location.pathname.split('/').pop() || 'index.html';
          navLinks.forEach(link => {
            link.classList.remove('active');
            const href = link.getAttribute('href').replace('./','');
            if(href === currentPath){
              link.classList.add('active');
            }
          })
        })();
    </script>
    <script src="./app.js"></script>
</body>
</html>
}
