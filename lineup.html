<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>万象棋阵容库</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
    background: #12161f;
    color: #e6e8ef;
    min-height: 100vh;
}

/* 顶部导航 */
.top-nav {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding: 12px 0;
    background: rgba(18, 22, 31, 0.85);
    position: sticky;
    top: 0;
    z-index: 50;
}

.top-nav a {
    color: #b4b9c6;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
}

.top-nav a.active {
    color: #ffd369;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 40px;
}

.page-title {
    text-align: center;
    font-size: 28px;
    color: #ffd369;
    margin-bottom: 24px;
}

/* 搜索框 */
.search-box {
    background: #1c212c;
    border: 1px solid #333844;
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 20px;
}

.search-box input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #e6e8ef;
    font-size: 15px;
}

.search-box input::placeholder {
    color: #686e7c;
}

/* 筛选区 */
.filter-section {
    margin-bottom: 24px;
}

.filter-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
}

.filter-label {
    font-size: 14px;
    color: #9aa0b0;
    width: 46px;
    flex-shrink: 0;
}

.filter-chip {
    padding: 6px 12px;
    border-radius: 8px;
    background: #1c212c;
    border: 1px solid #333844;
    color: #b4b9c6;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
}

.filter-chip.active {
    border-color: #ffd369;
    color: #ffd369;
    background: rgba(255, 211, 105, 0.08);
}

/* 棋手筛选：头像横向 */
.player-filter {
    display: flex;
    align-items: center;
    gap: 12px;
    overflow-x: auto;
    padding-bottom: 6px;
}

.player-chip {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    flex-shrink: 0;
    cursor: pointer;
    border: 2px solid #333844;
    overflow: hidden;
    background: #1c212c;
    transition: 0.2s;
}

.player-chip img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.player-chip.active {
    border-color: #ffd369;
    box-shadow: 0 0 0 2px rgba(255, 211, 105, 0.35);
}

/* 强度、阵营筛选 */
.rank-filter,
.camp-filter {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
}

.reset-btn {
    margin-left: auto;
    padding: 8px 14px;
    border-radius: 8px;
    background: #1c212c;
    border: 1px solid #333844;
    color: #b4b9c6;
    cursor: pointer;
    font-size: 14px;
}

.reset-btn:hover {
    color: #ffd369;
    border-color: #ffd369;
}

/* 阵容列表 */
.lineup-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

/* 阵容卡片：左侧棋手头像，右侧文字和英雄 */
.lineup-card {
    background: linear-gradient(135deg, #1c212c 0%, #272d3b 100%);
    border: 1px solid #333844;
    border-radius: 16px;
    padding: 16px;
    cursor: pointer;
    transition: 0.3s;
    display: flex;
    gap: 14px;
}

.lineup-card:hover {
    border-color: rgba(255, 211, 105, 0.45);
    transform: translateY(-2px);
}

.player-avatar {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    border: 2px solid #333844;
    overflow: hidden;
    flex-shrink: 0;
    background: #1c212c;
}

.player-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.card-main {
    flex: 1;
    min-width: 0;
}

.card-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
}

.rank-box {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: #7b3fd8;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.lineup-name {
    font-size: 16px;
    font-weight: 700;
    color: #ffd369;
}

.tag-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-left: 8px;
}

.tag {
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 11px;
    background: rgba(255, 211, 105, 0.12);
    color: #ffd369;
}

.lineup-meta {
    font-size: 12px;
    color: #9aa0b0;
    margin-bottom: 8px;
}

/* 英雄头像在文字下面 */
.hero-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: nowrap;
    overflow-x: auto;
    padding-bottom: 4px;
}

.mini-hero {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    border: 1px solid #333844;
    position: relative;
    flex-shrink: 0;
    overflow: hidden;
    background: #1c212c;
}

.mini-hero img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.mini-hero.core::after {
    content: "核";
    position: absolute;
    top: -4px;
    right: -4px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #7b3fd8;
    color: #fff;
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* 弹窗 */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-content {
    background: #181c26;
    border: 1px solid #333844;
    border-radius: 18px;
    width: min(760px, 100%);
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
    position: relative;
}

.modal-close {
    position: absolute;
    top: 16px;
    right: 20px;
    font-size: 24px;
    color: #888;
    cursor: pointer;
}

.modal-title {
    color: #ffd369;
    font-size: 22px;
    margin-bottom: 8px;
}

.modal-sub {
    color: #9aa0b0;
    font-size: 13px;
    margin-bottom: 16px;
}

.modal-block {
    background: #1c212c;
    border: 1px solid #282d38;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 14px;
}

.modal-block h4 {
    color: #ffd369;
    margin-bottom: 8px;
    font-size: 15px;
}

.modal-block p {
    color: #b4b9c6;
    line-height: 1.7;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="top-nav">
    <a href="#" class="active">全部阵容</a>
    <a href="#">S+</a>
    <a href="#">S</a>
</div>

<div class="container">
    <h1 class="page-title">万象棋阵容库</h1>

    <div class="search-box">
        <input id="searchInput" placeholder="搜索阵容名称、棋手、核心英雄..." />
    </div>

    <div class="filter-section">
        <!-- 棋手筛选 -->
        <div class="filter-row">
            <span class="filter-label">棋手</span>
            <div class="player-filter" id="playerFilter"></div>
        </div>

        <!-- 强度筛选 -->
        <div class="filter-row">
            <span class="filter-label">强度</span>
            <div class="rank-filter" id="rankFilter"></div>
        </div>

        <!-- 阵营筛选 -->
        <div class="filter-row">
            <span class="filter-label">阵营</span>
            <div class="camp-filter" id="campFilter"></div>
            <div class="reset-btn" id="resetBtn">重置</div>
        </div>
    </div>

    <div class="lineup-list" id="listWrap"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <span class="modal-close" id="modalClose">&times;</span>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-sub" id="modalSub"></div>
        <div id="modalBody"></div>
    </div>
</div>

<script>
const data = [
    {
        id: 1,
        name: "无限复活花木兰",
        rank: "S+",
        player: "嬴律",
        playerImg: "images/players/yinlv.png",
        hard: "中等",
        lineupCode: "38337677766581410",
        ban位: ["逐鹿", "大河流", "三分"],
        heroList: [
            { name: "花木兰", img: "images/heroes/huamulan.png", isCore: true },
            { name: "武则天", img: "images/heroes/wuzetian.png", isCore: false },
            { name: "李白", img: "images/heroes/libai.png", isCore: false },
            { name: "上官婉儿", img: "images/heroes/shangguanwaner.png", isCore: false },
            { name: "程咬金", img: "images/heroes/chenyaojin.png", isCore: false },
            { name: "钟馗", img: "images/heroes/zhongkui.png", isCore: false },
            { name: "露娜", img: "images/heroes/luna.png", isCore: false }
        ],
        equip: [
            { name: "贤者的庇护", img: "images/equip/fuhuo.png" }
        ]
    },
    {
        id: 2,
        name: "日落海司空震",
        rank: "S+",
        player: "玉环",
        playerImg: "images/players/yuhuan.png",
        hard: "困难",
        lineupCode: "76616412643475690",
        ban位: ["日落海"],
        heroList: [],
        equip: []
    },
    {
        id: 3,
        name: "孙膑三分体系",
        rank: "S+",
        player: "孙小宾",
        playerImg: "images/players/sunxiaobin.png",
        hard: "中等",
        lineupCode: "77743464511520968",
        ban位: ["逐鹿", "大河流", "河洛"],
        heroList: [],
        equip: []
    },
    {
        id: 4,
        name: "昭君河洛5+2",
        rank: "S+",
        player: "昭君",
        playerImg: "images/players/zhaojun.png",
        hard: "中等",
        lineupCode: "30456997313626170",
        ban位: ["逐鹿", "河洛", "三分", "日落海"],
        heroList: [],
        equip: []
    },
    {
        id: 5,
        name: "昭君75速冲",
        rank: "S+",
        player: "昭君",
        playerImg: "images/players/zhaojun.png",
        hard: "中等",
        lineupCode: "94633913646845962",
        ban位: ["逐鹿", "河洛", "日落海"],
        heroList: [],
        equip: []
    },
    {
        id: 6,
        name: "低阶龙蛇",
        rank: "S",
        player: "昭君",
        playerImg: "images/players/zhaojun.png",
        hard: "中等",
        lineupCode: "119403711597433866",
        ban位: ["逐鹿", "河洛", "三分", "日落海"],
        heroList: [],
        equip: []
    }
];

const listWrap = document.getElementById("listWrap");
const playerFilter = document.getElementById("playerFilter");
const rankFilter = document.getElementById("rankFilter");
const campFilter = document.getElementById("campFilter");
const searchInput = document.getElementById("searchInput");
const modal = document.getElementById("modal");
const modalClose = document.getElementById("modalClose");
const modalTitle = document.getElementById("modalTitle");
const modalSub = document.getElementById("modalSub");
const modalBody = document.getElementById("modalBody");
const resetBtn = document.getElementById("resetBtn");

let activePlayer = "";
let activeRank = "all";
let activeCamp = "all";

// 生成棋手头像筛选
const players = [...new Set(data.map(item => item.player))];
players.forEach(player => {
    const chip = document.createElement("div");
    chip.className = "player-chip";
    chip.dataset.player = player;

    const img = document.createElement("img");
    img.src = data.find(i => i.player === player).playerImg;
    img.alt = player;
    img.onerror = function () {
        this.style.display = "none";
        chip.style.background = "#272d3b";
        chip.textContent = player.charAt(0);
        chip.style.color = "#ffd369";
        chip.style.display = "flex";
        chip.style.alignItems = "center";
        chip.style.justifyContent = "center";
        chip.style.fontSize = "20px";
    };

    chip.appendChild(img);
    chip.onclick = () => {
        activePlayer = activePlayer === player ? "" : player;
        render();
    };

    playerFilter.appendChild(chip);
});

// 生成强度筛选
const ranks = ["all", "S+", "S", "A", "B"];
ranks.forEach(rank => {
    const chip = document.createElement("div");
    chip.className = "filter-chip";
    chip.dataset.rank = rank;
    chip.textContent = rank === "all" ? "全部" : rank;

    chip.onclick = () => {
        activeRank = rank;
        render();
    };

    rankFilter.appendChild(chip);
});

// 生成阵营筛选
const camps = ["all", "逐鹿", "大河流", "三分", "河洛", "日落海", "无阵营"];
camps.forEach(camp => {
    const chip = document.createElement("div");
    chip.className = "filter-chip";
    chip.dataset.camp = camp;
    chip.textContent = camp === "all" ? "全部" : camp;

    chip.onclick = () => {
        activeCamp = camp;
        render();
    };

    campFilter.appendChild(chip);
});

function render() {
    let filterData = [...data];

    if (activePlayer) {
        filterData = filterData.filter(item => item.player === activePlayer);
    }

    if (activeRank !== "all") {
        filterData = filterData.filter(item => item.rank === activeRank);
    }

    if (activeCamp !== "all") {
        filterData = filterData.filter(item => item.ban位.includes(activeCamp));
    }

    const keyword = searchInput.value.trim().toLowerCase();
    if (keyword) {
        filterData = filterData.filter(item =>
            item.name.toLowerCase().includes(keyword) ||
            item.player.toLowerCase().includes(keyword)
        );
    }

    // 棋手筛选高亮
    document.querySelectorAll(".player-chip").forEach(chip => {
        chip.classList.toggle("active", chip.dataset.player === activePlayer);
    });

    // 强度筛选高亮
    document.querySelectorAll("#rankFilter .filter-chip").forEach(chip => {
        chip.classList.toggle("active", chip.dataset.rank === activeRank);
    });

    // 阵营筛选高亮
    document.querySelectorAll("#campFilter .filter-chip").forEach(chip => {
        chip.classList.toggle("active", chip.dataset.camp === activeCamp);
    });

    if (filterData.length === 0) {
        listWrap.innerHTML = `<div style="text-align:center;color:#686e7c;padding:40px;">没有匹配的阵容</div>`;
        return;
    }

    listWrap.innerHTML = filterData.map(item => {
        let heroHtml = "";

        if (item.heroList && item.heroList.length > 0) {
            heroHtml = item.heroList.map(h => `
                <div class="mini-hero ${h.isCore ? "core" : ""}">
                    <img src="${h.img}" alt="${h.name}" />
                </div>
            `).join("");
        } else {
            heroHtml = `<span style="color:#777;font-size:13px;">暂未更新</span>`;
        }

        const tagHtml = item.ban位.map(tag => `<span class="tag">${tag}</span>`).join("");

        return `
            <div class="lineup-card" data-id="${item.id}">
                <div class="player-avatar">
                    <img src="${item.playerImg}" alt="${item.player}" />
                </div>
                <div class="card-main">
                    <div class="card-top">
                        <div class="rank-box">${item.rank}</div>
                        <div class="lineup-name">${item.name}</div>
                        <div class="tag-row">${tagHtml}</div>
                    </div>
                    <div class="lineup-meta">
                        棋手：${item.player}｜难度：${item.hard}｜代码：${item.lineupCode}
                    </div>
                    <div class="hero-row">${heroHtml}</div>
                </div>
            </div>
        `;
    }).join("");

    // 卡片点击弹窗
    document.querySelectorAll(".lineup-card").forEach(card => {
        card.onclick = () => {
            const item = data.find(i => i.id == card.dataset.id);
            modalTitle.textContent = item.name;
            modalSub.textContent = `棋手：${item.player}｜难度：${item.hard}｜代码：${item.lineupCode}`;

            modalBody.innerHTML = `
                <div class="modal-block">
                    <h4>ban位</h4>
                    <p>${item.ban位.join("、")}</p>
                </div>
            `;

            modal.classList.add("show");
        };
    });
}

modalClose.onclick = () => modal.classList.remove("show");
modal.onclick = e => {
    if (e.target === modal) modal.classList.remove("show");
};

resetBtn.onclick = () => {
    activePlayer = "";
    activeRank = "all";
    activeCamp = "all";
    searchInput.value = "";
    render();
};

searchInput.oninput = render;

render();
</script>

</body>
</html>
