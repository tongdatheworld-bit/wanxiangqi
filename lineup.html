<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阵容大全 | 王者万象棋 - 万象一图诀</title>
    <base href="./">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #12161f;
            color: #e6e8ef;
            background-image: radial-gradient(circle at 40% 20%, rgba(204, 164, 79, 0.08), transparent 45%);
            min-height: 100vh;
        }

        /* 顶部导航 */
        .top-nav-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 20px;
            background-color: rgba(18, 22, 31, 0.75);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .top-nav-wrap a {
            text-decoration: none;
            color: #b4b9c6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .top-nav-wrap a:hover {
            color: #ffd369;
            background-color: rgba(255,211,105,0.08);
        }

        .top-nav-wrap a.active {
            color: #ffd369;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .page-title {
            font-size: 32px;
            text-align: center;
            margin-bottom: 24px;
            color: #ffd369;
        }

        /* 搜索框 */
        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 0 auto 20px;
            background: #1c212c;
            border: 1px solid #333844;
            border-radius: 12px;
            padding: 12px 18px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e6e8ef;
            font-size: 16px;
            padding-left: 10px;
        }

        .search-box input::placeholder {
            color: #686e7c;
        }

        /* 筛选区 */
        .filter-wrap {
            margin-bottom: 24px;
        }
        .filter-row {
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:12px;
        }
        .filter-label{
            color:#9aa0b0;
            width:50px;
            flex-shrink:0;
        }
        .filter-group-inner{
            display:flex;
            align-items:center;
            gap:10px;
            flex:1;
        }
        /* 【普通文字筛选按钮：强度、阵营 保持原样】 */
        .filter-chip{
            padding:6px 12px;
            border-radius:8px;
            background:#1c212c;
            border:1px solid #333844;
            color:#b4b9c6;
            cursor:pointer;
            transition:0.2s;
            white-space:nowrap;
        }
        .filter-chip.active{
            border-color:#ffd369;
            color:#ffd369;
            background:rgba(255,211,105,0.08);
        }
        /* ========== 棋手头像单独覆盖样式 ========== */
        .player-chip {
            all: unset;
            display: block;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid #333844;
            background: #1c212c;
            cursor: pointer;
        }
        .player-chip img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .player-chip.active {
            border-color:#ffd369;
            box-shadow: 0  0  6px rgba(255,211,105,0.25);
        }
        /* 棋手那一行开启横向滚动，不再换行 */
        .filter-row.player-row {
            overflow-x: auto;
            overflow-y: hidden;
            flex-wrap: nowrap;
            padding: 6px 0;
        }
        .filter-row.player-row::-webkit-scrollbar {
            height: 4px;
        }
        .filter-row.player-row::-webkit-scrollbar-track {
            background: #12161f;
        }
        .filter-row.player-row::-webkit-scrollbar-thumb {
            background: #333844;
            border-radius: 2px;
        }
        .reset-btn{
            margin-left:auto;
            padding:6px 14px;
            border-radius:8px;
            background:#1c212c;
            border:1px solid #333844;
            color:#b4b9c6;
            cursor:pointer;
            white-space:nowrap;
        }
        .reset-btn:hover{
            color:#ffd369;
            border-color:#ffd369;
        }

        /* 阵容列表 */
        .lineup-list {
            display: flex;
            flex-direction: column;
            gap:16px;
        }

/* 阵容卡片 */
.lineup-card {
    background: #171c29;
    border-radius: 16px;
    padding: 20px;
    cursor: pointer;
    transition: 0.3s ease;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
}
.lineup-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(255, 211, 105, 0.15);
}

/* 【上层：文字信息行】 */
.lineup-info-top {
    display: flex;
    align-items: center;
    gap:12px;
    flex-wrap: nowrap;
    margin-bottom:16px;
}
.lineup-name {
    font-size:28px;
    font-weight:bold;
    color:#ffd369;
    white-space: nowrap;
}
.ban-title-tag {
    background-color:#d62222;
    color:#fff;
    padding:4px 8px;
    border-radius:6px;
    font-weight:bold;
}
.ban-item {
    padding:4px 10px;
    background:#282e3b;
    border-radius:6px;
    color:#ffd369;
    font-weight: 700;
}
.lineup-meta {
    color:#b1b6c2;
    font-size:15px;
    margin-left:auto;
    white-space: nowrap;
}
.copy-code {
    color:#ffd369;
    cursor:pointer;
}
.copy-code:hover {
    text-decoration: underline;
}

/* 【下层：横向一行：强度 + 棋手组 + 英雄组】 */
.lineup-bottom-row {
    display: flex;
    align-items: center;
    gap:16px;
}
/* S+强度方块 */
.lineup-rank {
    width:90px;
    height:90px;
    flex-shrink:0;
    background:#7b3fd8;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:36px;
    font-weight:900;
    color:#fff;
}
/* 棋手区域：主棋手 + 备选棋手 */
.player-group {
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
}
.main-player {
    width:90px;
    height:90px;
    border-radius:16px;
    overflow:hidden;
}
.main-player img {
    width:100%;
    height:100%;
    object-fit:cover;
}
.alternate-col {
    display:flex;
    flex-direction:column;
    gap:6px;
}
.alternate-player-label {
    background:rgba(255,211,105,0.12);
    color:#ffd369;
    font-size:12px;
    padding:2px 6px;
    border-radius:4px;
    text-align:center;
    width:fit-content;
}
.alternate-wrap {
    display:flex;
    gap:6px;
}
.alt-player {
    width:56px;
    height:56px;
    border-radius:12px;
    overflow:hidden;
}
.alt-player img {
    width:100%;
    height:100%;
    object-fit:cover;
}
       /* 分割线样式 */
.hero-divider {
    width: 2px;
    height: 52px;
    background: #2f3542;
    border-radius: 1px;
    flex-shrink: 0;
    margin:0 6px;
}
/* 英雄区域，自动占满剩余宽度 */
.hero-row {
    display:flex;
    gap:10px;
    flex:1;
    justify-content:flex-start;
    align-items:center;
}
.mini-hero {
    width:90px;
    height:90px;
    border-radius:16px;
    overflow:hidden;
    position:relative;
    flex-shrink:0;
}
.mini-hero img {
    width:100%;
    height:100%;
    object-fit:cover;
}
.mini-hero.core::after {
    content:"核";
    position:absolute;
    top:-4px;
    right:-4px;
    width:22px;
    height:22px;
    background:#7b3fd8;
    color:#fff;
    font-size:12px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}

        /* 弹窗 */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            width: min(820px, 100%);
            background: #181c26;
            border: 1px solid #333844;
            border-radius: 20px;
            max-height: 86vh;
            overflow-y: auto;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            float: right;
            color: #888;
            font-size: 26px;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-close:hover {
            color: #ffd369;
        }

        .modal h2 {
            color: #ffd369;
            margin-bottom: 10px;
            font-size: 26px;
        }
        .modal-sub{
            color:#9aa0b0;
            margin-bottom:16px;
        }
        .modal-block {
            margin: 16px 0;
            background: #1c212c;
            border: 1px solid #282d38;
            border-radius: 14px;
            padding: 16px 18px;
        }

        .modal-block h4 {
            color: #ffd369;
            margin-bottom: 8px;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-block h4::before {
            content: "";
            width: 3px;
            height: 14px;
            background: #ffd369;
            border-radius: 2px;
        }
       .modal-block p {
    color: #b4b9c6;
    line-height: 1.8;
    font-size: 15px;
}
/* 专门给ul列表，解决圆点贴左边框！ */
.modal-block ul {
    padding-left: 22px;
    margin: 8px 0;
}
.modal-block li {
    color:#888c99;
    line-height:1.7;
    font-size:15px;
    margin-bottom:8px;
    word-break: break-word;
}
        .link-official{
            display:inline-block;
            margin-top:10px;
            padding:8px 14px;
            background:#7b3fd8;
            color:#fff;
            border-radius:8px;
            text-decoration:none;
        }
        .link-official:hover{
            opacity:0.9;
        }
        /* ========= 弹窗首选/次选圆形装备 【新增，解决装备超大】 ========= */
        .equip-list{
            display:flex;
            gap:12px;
            flex-wrap:wrap;
            margin:10px 0;
        }
        .equip-pill{
            width: 54px;
            height: 54px;
            display:block;
            border-radius:50%;
            overflow:hidden;
            border:1px solid #333844;
            flex:0 0 auto;
        }
        .equip-pill img{
            width:100%;
            height:100%;
            object-fit:cover;
            display:block;
        }
        /* 滚动条美化 */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: #333844;
            border-radius: 4px;
        }
        .modal-content::-webkit-scrollbar-thumb:hover {
            background: #ffd369;
        }

        /* ========= 弹窗详情内英雄行 ========= */
        .hero-row-modal{
            display:flex;
            gap:8px;
            margin:10px 0;
            flex-wrap:wrap;
        }
        .mini-hero-modal{
            width:64px;
            height:64px;
            border-radius:8px;
            border:1px solid #333844;
            position:relative;
            overflow: hidden;
        }
        .mini-hero-modal img{
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .mini-hero-modal.core::after{
            content:"核";
            position:absolute;
            top:-4px;
            right:-4px;
            width:20px;
            height:20px;
            border-radius:50%;
            background:#7b3fd8;
            color:#fff;
            font-size:11px;
            display:flex;
            align-items:center;
            justify-content:center;
        }

       /* ========= 装备行 ========= */
.equip-row{
    display:flex;
    gap:12px;
    align-items:center;
    margin:10px 0;
    flex-wrap:wrap;
}
.equip-item{
    text-align:center;
    width:70px;
}
.equip-item img{
    width:26px !important;
    height:26px !important;
    border-radius:8px;
    border:1px solid #333844;
    object-fit: contain;
    display: block;
    margin:0 auto;
}
.equip-item span{
    display:block;
    font-size:12px;
    color:#b4b9c6;
    margin-top:4px;
}
.equip-tag{
    color:#ffd369;
    font-weight:bold;
    width:40px;
}
      
        /* ========= 弹窗头部信息行 ========= */
        .modal-top-info{
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:16px;
        }
        .modal-top-info img{
            width:72px;
            height:72px;
            border-radius:50%;
            object-fit:cover;
        }
        .top-tags-wrap{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .top-tag{
            padding:4px 10px;
            background:#1c212c;
            border:1px solid #333844;
            border-radius:6px;
            font-size:14px;
            color:#b4b9c6;
        }
        /* ========= 运营节奏模块【新增】 ========= */
.run-stage-list{
    display:flex;
    flex-direction:column;
    gap:14px;
}
.run-stage-item{
    background:#1c212c;
    border:1px solid #282d38;
    border-radius:14px;
    padding:16px 18px;
}
.run-stage-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:15px;
}
/* 阶段显眼标签：1-3回合 /4-11 /12回合以后 */
.run-stage-tag{
    display:inline-block;
    padding:5px 14px;
    border-radius:8px;
    background:linear-gradient(135deg,#ffd369,#ffb020);
    color:#12161f;
    font-size:14px;
    font-weight:800;
    box-shadow:0 4px 10px rgba(255,176,32,0.35);
    letter-spacing:1px;
}
.run-stage-heros{
    display:flex;
    gap:12px;
    margin-bottom:10px;
    flex-wrap:wrap;
}
/* 运营节奏头像 64×64 */
.run-stage-hero{
    width:64px;
    height:64px;
    border-radius:10px;
    border:1px solid #333844;
    overflow:hidden;
    position:relative;
}
.run-stage-hero img{
    width:100%;
    height:100%;
    object-fit:cover;
}
/* 隐藏英雄名字 */
.run-stage-hero-name{
    display:none;
}
.run-stage-text{
    color:#b4b9c6;
    line-height:1.8;
    font-size:14px;
}
 /* ====== 天赋推荐：整行铺满 6 张 ====== */
.talent-group-row {
    display: flex;
    gap: 12px;
    flex-wrap: nowrap;
    margin: 12px 0;
}

.talent-col {
    flex: 1;
    min-width: 0;
}

.talent-col-title {
    font-size: 13px;
    margin-bottom: 8px;
    padding: 3px 8px;
    border-radius: 6px;
    display: inline-block;
}

.talent-tong {
    background: #70543c;
    color: #ffddb0;
}

.talent-yin {
    background: #787c84;
    color: #e8ebf0;
}

.talent-jin {
    background: #b88600;
    color: #fff8e0;
}

.talent-item-list {
    display: flex;
    gap: 10px;
    flex-wrap: nowrap;
}

/* 天赋卡片：每组 2 张，撑满各自列宽 */
.talent-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
}

.talent-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    object-fit: cover;
    border: 1px solid #3a404f;
    background: #282e3b;
}

.talent-card span {
    font-size: 13px;
    color: #b4b9c6;
    text-align: center;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
}

/* ====== 效果牌：和天赋同一尺寸体系 ====== */
.effect-card-list {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 12px 0;
}

.effect-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 96px;
}

.effect-card img {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    object-fit: cover;
    border: 1px solid #3a404f;
    background: #282e3b;
}

.effect-card span {
    font-size: 13px;
    color: #ffd369;
    text-align: center;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
}


        /* ========= 运营节奏样式（匹配你当前class） ========= */
.stage-block {
    background:#1c212c;
    border:1px solid #282d38;
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:14px;
}
.stage-title {
    margin-bottom:10px;
}
.run-stage-tag{
    display:inline-block;
    padding:5px 14px;
    border-radius:8px;
    background:linear-gradient(135deg,#ffd369,#ffb020);
    color:#12161f;
    font-size:14px;
    font-weight:800;
    box-shadow:0 4px 10px rgba(255,176,32,0.35);
    letter-spacing:1px;
}
.stage-heroes{
    display:flex;
    gap:12px;
    margin-bottom:10px;
    flex-wrap:wrap;
}
.hero-pill.small{
    width:64px;
    height:64px;
    border-radius:10px;
    border:1px solid #333844;
    overflow:hidden;
    display:block;
}
.hero-pill.small img{
    width:100%;
    height:100%;
    object-fit:cover;
}
/* 回合阶段文字 */
.stage-desc{
    color:#888c99;
    line-height:1.7;
    font-size:15px;
}
.empty-text{
    color:#777;
    font-size:13px;
}
/* ========= 站位截图图框 ========= */
.position-image-box{
    width:100%;
    min-height:220px;
    border-radius:16px;
    border:2px solid #2a2f3d;
    background:linear-gradient(145deg, #171a23 0%, #1c2130 100%);
    padding:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    box-shadow:inset 0 0 20px rgba(0,0,0,0.4);
}
.position-image-box img{
    width:100%;
    max-width:100%;
    height:auto;
    border-radius:12px;
    display:block;
    border:1px solid #333844;
    box-shadow:0 8px 24px rgba(0,0,0,0.35);
}
.position-image-placeholder{
    color:#686e7c;
    font-size:14px;
    padding:24px;
    text-align:center;
}
        /* 阵容码复制hover */
        .copy-code{
            cursor: pointer;
        }
        .copy-code:hover{
            color:#ffd369;
        }
    </style>
</head>

    <div class="container">
        <h2 class="page-title">阵容大全</h2>

        <div class="search-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#888e9c">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input id="searchInput" type="text" placeholder="搜索阵容名称 / 核心英雄...">
        </div>

        <div class="filter-wrap">
            <div class="filter-row player-row">
                <span class="filter-label">棋手</span>
                <div class="filter-group-inner">
                    <div class="filter-chip active" data-filter="player" data-val="all">全部</div>
                    <div class="filter-chip player-chip" data-filter="player" data-val="小妲己" title="小妲己">
                        <img src="images/players/xiaodaji.png" alt="小妲己">
                    </div>
                    <div class="filter-chip player-chip" data-filter="player" data-val="瑶妹" title="瑶妹">
                        <img src="images/players/yaomei.png" alt="瑶妹">
                    </div>
                    <div class="filter-chip player-chip" data-filter="player" data-val="阿离" title="阿离">
                        <img src="images/players/ali.png" alt="阿离">
                    </div>
                    <div class="filter-chip player-chip" data-filter="player" data-val="镜" title="镜">

    <script>
        //导航高亮
        (function(){
          const navLinks = document.querySelectorAll('.top-nav-wrap a');
          const currentPath = location.pathname.split('/').pop() || 'index.html';
          navLinks.forEach(link => {
            link.classList.remove('active');
            const href = link.getAttribute('href').replace('./','');
            if(href === currentPath){
              link.classList.add('active');
            }
          })
        })();
