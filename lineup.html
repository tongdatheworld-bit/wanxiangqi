<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>阵容大全 | 王者万象棋 - 万象一图诀</title>
    <base href="./">
    <link rel="stylesheet" href="./common.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #12161f;
            color: #e6e8ef;
            background-image: radial-gradient(circle at 40% 20%, rgba(204, 164, 79, 0.08), transparent 45%);
            min-height: 100vh;
        }

        /* 顶部导航 */
        .top-nav-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 20px;
            background-color: rgba(18, 22, 31, 0.75);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .top-nav-wrap a {
            text-decoration: none;
            color: #b4b9c6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }

        .top-nav-wrap a:hover {
            color: #ffd369;
            background-color: rgba(255,211,105,0.08);
        }

        .top-nav-wrap a.active {
            color: #ffd369;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        .page-title {
            font-size: 32px;
            text-align: center;
            margin-bottom: 24px;
            color: #ffd369;
        }

        /* 搜索框 */
        .search-box {
            display: flex;
            align-items: center;
            width: 100%;
            margin: 0 auto 20px;
            background: #1c212c;
            border: 1px solid #333844;
            border-radius: 12px;
            padding: 12px 18px;
        }

        .search-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #e6e8ef;
            font-size: 16px;
            padding-left: 10px;
        }

        .search-box input::placeholder {
            color: #686e7c;
        }

        /* 筛选区 */
        .filter-wrap {
            margin-bottom: 24px;
        }
        .filter-row {
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:12px;
        }
        .filter-label{
            color:#9aa0b0;
            width:50px;
            flex-shrink:0;
        }
        .filter-group-inner{
            display:flex;
            align-items:center;
            gap:10px;
            flex:1;
        }
        /* 【普通文字筛选按钮：强度、阵营 保持原样】 */
        .filter-chip{
            padding:6px 12px;
            border-radius:8px;
            background:#1c212c;
            border:1px solid #333844;
            color:#b4b9c6;
            cursor:pointer;
            transition:0.2s;
            white-space:nowrap;
        }
        .filter-chip.active{
            border-color:#ffd369;
            color:#ffd369;
            background:rgba(255,211,105,0.08);
        }
        /* ========== 棋手头像单独覆盖样式 ========== */
        .player-chip {
            all: unset;
            display: block;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            border: 2px solid #333844;
            background: #1c212c;
            cursor: pointer;
        }
        .player-chip img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .player-chip.active {
            border-color:#ffd369;
            box-shadow: 0  0  6px rgba(255,211,105,0.25);
        }
        /* 棋手那一行开启横向滚动，不再换行 */
        .filter-row.player-row {
            overflow-x: auto;
            overflow-y: hidden;
            flex-wrap: nowrap;
            padding: 6px 0;
        }
        .filter-row.player-row::-webkit-scrollbar {
            height: 4px;
        }
        .filter-row.player-row::-webkit-scrollbar-track {
            background: #12161f;
        }
        .filter-row.player-row::-webkit-scrollbar-thumb {
            background: #333844;
            border-radius: 2px;
        }
        .reset-btn{
            margin-left:auto;
            padding:6px 14px;
            border-radius:8px;
            background:#1c212c;
            border:1px solid #333844;
            color:#b4b9c6;
            cursor:pointer;
            white-space:nowrap;
        }
        .reset-btn:hover{
            color:#ffd369;
            border-color:#ffd369;
        }

        /* 阵容列表 */
        .lineup-list {
            display: flex;
            flex-direction: column;
            gap:16px;
        }

        /* 阵容卡片 */
        .lineup-card {
            background: #171c29;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }
        .lineup-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(255, 211, 105, 0.15);
        }

        /* 【上层：文字信息行】 */
        .lineup-info-top {
            display: flex;
            align-items: center;
            gap:12px;
            flex-wrap: nowrap;
            margin-bottom:16px;
        }
        .lineup-name {
            font-size:28px;
            font-weight:bold;
            color:#ffd369;
            white-space: nowrap;
        }
        .ban-title-tag {
            background-color:#d62222;
            color:#fff;
            padding:4px 8px;
            border-radius:6px;
            font-weight:bold;
        }
        .ban-item {
            padding:4px 10px;
            background:#282e3b;
            border-radius:6px;
            color:#ffd369;
            font-weight: 700;
        }
        .lineup-meta {
            color:#b1b6c2;
            font-size:15px;
            margin-left:auto;
            white-space: nowrap;
        }
        .copy-code {
            color:#ffd369;
            cursor:pointer;
        }
        .copy-code:hover {
            text-decoration: underline;
        }

        /* 【下层：横向一行：强度 + 棋手组 + 英雄组】 */
        .lineup-bottom-row {
            display: flex;
            align-items: center;
            gap:16px;
        }
        /* S+强度方块 */
        .lineup-rank {
            width:90px;
            height:90px;
            flex-shrink:0;
            background:#7b3fd8;
            border-radius:16px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:36px;
            font-weight:900;
            color:#fff;
        }
        /* 棋手区域：主棋手 + 备选棋手 */
        .player-group {
            display:flex;
            align-items:center;
            gap:10px;
            flex-shrink:0;
        }
        .main-player {
            width:90px;
            height:90px;
            border-radius:16px;
            overflow:hidden;
        }
        .main-player img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .alternate-col {
            display:flex;
            flex-direction:column;
            gap:6px;
        }
        .alternate-player-label {
            background:rgba(255,211,105,0.12);
            color:#ffd369;
            font-size:12px;
            padding:2px 6px;
            border-radius:4px;
            text-align:center;
            width:fit-content;
        }
        .alternate-wrap {
            display:flex;
            gap:6px;
        }
        .alt-player {
            width:56px;
            height:56px;
            border-radius:12px;
            overflow:hidden;
        }
        .alt-player img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        /* 分割线样式 */
        .hero-divider {
            width: 2px;
            height: 52px;
            background: #2f3542;
            border-radius: 1px;
            flex-shrink: 0;
            margin:0 6px;
        }
        /* 英雄区域，自动占满剩余宽度 */
        .hero-row {
            display:flex;
            gap:10px;
            flex:1;
            justify-content:flex-start;
            align-items:center;
        }
        .mini-hero {
            width:90px;
            height:90px;
            border-radius:16px;
            overflow:hidden;
            position:relative;
            flex-shrink:0;
        }
        .mini-hero img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .mini-hero.core::after {
            content:"核";
            position:absolute;
            top:-4px;
            right:-4px;
            width:22px;
            height:22px;
            background:#7b3fd8;
            color:#fff;
            font-size:12px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .link-official{
            display:inline-block;
            margin-top:10px;
            padding:8px 14px;
            background:#7b3fd8;
            color:#fff;
            border-radius:8px;
            text-decoration:none;
        }
        .link-official:hover{
            opacity:0.9;
        }

        /* ====================== 弹窗新增样式（和app.js弹窗模板配套） ====================== */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            width: min(860px, 100%);
            background: #171a23;
            border: 1px solid #2a2f3d;
            border-radius: 18px;
            max-height: 92vh;
            overflow-y: auto;
            padding: 24px 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .modal-close {
            float: right;
            color: #7c8292;
            font-size: 28px;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1;
        }
        .modal-close:hover {
            color: #ffd369;
        }
        .modal-top-info {
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:18px;
        }
        .player-avatar {
            width:70px;
            height:70px;
            border-radius:14px;
            object-fit:cover;
        }
        .info-text h2 {
            color:#ffd369;
            font-size:24px;
            margin-bottom:4px;
        }
        .modal-sub {
            color:#9aa0b0;
            font-size:14px;
        }
        .modal-block {
            background: #1c212c;
            border: 1px solid #282d38;
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 16px;
        }
        .modal-block h4 {
            color: #ffd369;
            font-size: 15px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .empty-text {
            color:#686e7c;
        }
        .mini-hero-modal {
            width:64px;
            height:64px;
            border-radius:14px;
            overflow:hidden;
            position:relative;
            flex-shrink:0;
        }
        .mini-hero-modal img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .mini-hero-modal.core::after {
            content:"核";
            position:absolute;
            top:-4px;
            right:-4px;
            width:20px;
            height:20px;
            background:#7b3fd8;
            color:#fff;
            font-size:11px;
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .hero-row-modal {
            display:flex;
            gap:12px;
            flex-wrap:wrap;
        }
        .equip-pill {
            width:44px;
            height:44px;
            border-radius:12px;
            overflow:hidden;
            border:1px solid #333844;
            background:#282e3b;
            flex-shrink:0;
        }
        .equip-pill img {
            width:100%;
            height:100%;
            object-fit:cover;
        }
        .equip-list {
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }
        .code-text {
            color:#ffd369;
            cursor:pointer;
        }
        .code-text:hover {
            text-decoration:underline;
        }
        /* 阵容组成：头像+下方名字 */
        .lineup-hero-row {
            display: flex;
            gap:12px;
            flex-wrap: wrap;
        }
        .lineup-hero-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap:4px;
        }
        .hero-name-text {
            font-size:12px;
            color:#c7cad4;
        }
        /* 功能性英雄：左头像，右名称+描述 */
        .func-hero-list {
            display:flex;
            flex-direction: column;
            gap:14px;
        }
        .func-hero-item {
            display:flex;
            align-items: flex-start;
            gap:12px;
        }
        .func-info {
            flex:1;
        }
        .func-name {
            color:#ffd369;
            font-size:14px;
            font-weight:bold;
            margin-bottom:3px;
        }
        .func-desc {
            font-size:13px;
            color:#b4b9c6;
            line-height:1.6;
        }
/* ===== 装备选择：首选、备选左右并排，不再上下分行 ===== */

.equip-area {
  background: #1c212c;
  border: 1px solid #282d38;
  border-radius: 14px;
  padding: 16px 18px;
  margin-bottom: 16px;
}

.equip-area-title {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #ffd369;
  font-size: 15px;
  font-weight: 800;
  margin-bottom: 14px;
}

.equip-area-title::before {
  content: "|";
  color: #ffd369;
  font-weight: 900;
}

.equip-main-row {
  display: flex;
  align-items: center;
  gap: 18px;
}

.equip-main-hero {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.equip-main-hero .mini-hero-modal {
  width: 72px;
  height: 72px;
  border-radius: 16px;
  border: 1px solid #333844;
  overflow: hidden;
  background: #282e3b;
}

.equip-main-hero .mini-hero-modal img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.equip-main-hero .hero-name-text {
  font-size: 12px;
  color: #cfd3de;
}

/* 右侧：首选和备选左右并排 */
.equip-side {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 28px;
  min-width: 0;
}

.equip-group {
  display: flex;
  align-items: center;
  gap: 12px;
}

.equip-group-label {
  color: #ffd369;
  font-size: 14px;
  font-weight: 800;
  white-space: nowrap;
}

.equip-list-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: nowrap;
}

.equip-pill {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid #333844;
  background: #282e3b;
  overflow: hidden;
  flex-shrink: 0;
}

.equip-pill img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

      /* ====== 运营节奏文字统一为注意事项样式 ====== */

.run-stage-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.stage-block {
    background: #1c212c;
    border: 1px solid #282d38;
    border-radius: 14px;
    padding: 16px 18px;
}

.stage-title {
    margin-bottom: 10px;
}

.run-stage-tag {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 8px;
    background: linear-gradient(135deg, #ffd369, #ffb020);
    color: #12161f;
    font-size: 14px;
    font-weight: 800;
    box-shadow: 0 4px 10px rgba(255, 176, 32, 0.35);
    letter-spacing: 1px;
}

/* 运营节奏英雄图标：一排最多7个 */
.stage-heroes {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    gap: 8px;
    align-items: flex-start;
    margin-bottom: 10px;
}
.hero-pill.small {
    flex: 0 1 calc((100% - 6 * 8px) / 7);
    max-width: 90px;
}
.hero-pill.small img {
    width: 100%;
    height: auto;
    aspect-ratio: 1/1;
    border-radius: 10px;
    object-fit: cover;
    display: block;
}

/* 运营节奏正文：跟注意事项保持一致 */
.stage-desc {
    color: #f2f4fa;
    line-height: 1.7;
    font-size: 16px;
    margin: 0;
    padding: 0;
}

/* 注意事项原有样式保持，只做对齐 */
.notice-list {
    padding-left: 22px;
    margin: 8px 0;
}

.notice-list li {
    color: #f2f4fa;
    line-height: 1.7;
    font-size: 16px;
    margin-bottom: 8px;
    word-break: break-word;
}

        }
        .position-image-box img {
            max-width:100%;
            border-radius:12px;
        }
        .position-image-placeholder {
            text-align:center;
            color:#686e7c;
            padding:20px;
        }
        /* 弹窗滚动条 */
        .modal-content::-webkit-scrollbar {
            width: 8px;
        }
        .modal-content::-webkit-scrollbar-thumb {
            background: #333844;
            border-radius: 4px;
        }
        .modal-content::-webkit-scrollbar-thumb:hover {
            background: #ffd369;
        }
    </style>
</head>

                    <div class="filter-chip player-chip" data-filter="player" data-val="奕星" title="奕星">
                        <img src="images/players/yixing.png" alt="奕星">
                    </div>
                    <div class="filter-chip player-chip" data-filter="player" data-val="孙小宾" title="孙小宾">

    <script>
        //导航高亮
        (function(){
          const navLinks = document.querySelectorAll('.top-nav-wrap a');
          const currentPath = location.pathname.split('/').pop() || 'index.html';
          navLinks.forEach(link => {
            link.classList.remove('active');
            const href = link.getAttribute('href').replace('./','');
            if(href === currentPath){
              link.classList.add('active');
            }
          })
        })();
    </script>
