<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>王者万象棋 - 阵容大全</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", sans-serif;
}
body {
    background-color: #171922;
    color: #e2e4ec;
    padding-bottom: 40px;
}
/* ========== 【换回你原来的旧版导航】 ========== */
.old-top-nav {
    display: flex;
    justify-content: center;
    background-color: #1e202b;
    border-bottom: 1px solid #2c303f;
    gap: 4px;
    padding: 0 12px;
}
.old-top-nav a {
    padding:14px 18px;
    color: #b0b4c2;
    text-decoration: none;
    font-size: 15px;
    position: relative;
}
.old-top-nav a.active {
    color: #ffd358;
}
.old-top-nav a.active::after{
    content:"";
    position:absolute;
    bottom:0;
    left:12%;
    width:76%;
    height:3px;
    background:#ffd358;
    border-radius:2px 2px 0 0;
}
/* 页面标题 */
.page-title {
    text-align: center;
    font-size: 26px;
    color: #ffd358;
    margin:20px 0;
}
.container {
    max-width: 940px;
    margin: 0 auto;
    padding: 0 16px;
}
/* 搜索框 */
.search-bar {
    width: 100%;
    background: #20232f;
    border: 1px solid #2c303f;
    border-radius: 6px;
    padding: 9px 14px;
    color: #fff;
    outline: none;
    margin-bottom: 16px;
}
.search-bar::placeholder {
    color: #74798c;
}
/* 筛选组通用 */
.filter-group {
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.filter-label {
    width: 44px;
    color: #9297a8;
    font-size: 14px;
    flex-shrink: 0;
}
.filter-wrap {
    display: flex;
    gap: 8px;
    flex: 1;
    overflow-x: auto;
    padding-bottom: 4px;
}
.filter-chip {
    padding: 5px 12px;
    border-radius: 4px;
    background: #20232f;
    color: #b0b4c2;
    font-size:14px;
    cursor: pointer;
    white-space: nowrap;
    border: 1px solid transparent;
}
.filter-chip.active {
    background: #322b58;
    color: #ffd358;
    border-color: #ffd358;
}
/* 棋手头像筛选 */
.player-avatar-chip {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    border: 2px solid transparent;
    cursor: pointer;
    background:#20232f;
}
.player-avatar-chip.active {
    border-color:#ffd358;
}
.player-avatar-chip img {
    width:100%;
    height:100%;
    object-fit:cover;
}
.reset-btn {
    padding:5px 12px;
    background:#20232f;
    color:#b0b4c2;
    border-radius:4px;
    cursor:pointer;
    font-size:14px;
    border:1px solid #2c303f;
    white-space:nowrap;
}
/* 阵容卡片 */
.lineup-list {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap:10px;
}
.lineup-card {
    background:#20232f;
    border-radius:6px;
    padding:12px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
}
.card-avatar {
    width:42px;
    height:42px;
    border-radius:50%;
    overflow:hidden;
    flex-shrink:0;
    background:#2c303f;
}
.card-avatar img {
    width:100%;
    height:100%;
    object-fit:cover;
}
.rank-tag {
    width:40px;
    height:40px;
    border-radius:6px;
    background:#7b42d8;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex-shrink:0;
}
.card-body {
    flex:1;
}
.card-name-row {
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:4px;
}
.lineup-name {
    font-weight:bold;
    font-size:15px;
}
.camp-tag {
    padding:2px 6px;
    background:#2c303f;
    color:#ffd358;
    font-size:12px;
    border-radius:3px;
}
.card-desc {
    color:#868b9e;
    font-size:12px;
}
.arrow {
    color:#74798c;
}
/* 弹窗 */
.modal {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:99;
}
.modal.show {
    display:flex;
}
.modal-box {
    width:min(700px,92%);
    background:#20232f;
    border-radius:10px;
    padding:20px;
}
.modal-title {
    color:#ffd358;
    font-size:20px;
    margin-bottom:12px;
}
</style>
</head>
<body>
<!-- ========== 【旧版导航栏，就是你原来那套】 ========== -->
<div class="old-top-nav">
    <a href="#">首页</a>
    <a href="#" class="active">阵容大全</a>
    <a href="#">棋手</a>
    <a href="#">英雄牌</a>
    <a href="#">天赋牌</a>
    <a href="#">装备牌</a>
    <a href="#">效果牌</a>
    <a href="#">信息差</a>
</div>

<div class="container">
    <h2 class="page-title">阵容大全</h2>
    <input class="search-bar" id="search" placeholder="搜索阵容名称 / 核心英雄..." />

    <!-- 棋手筛选 -->
    <div class="filter-group">
        <div class="filter-label">棋手</div>
        <div class="filter-wrap" id="playerWrap">
            <div class="filter-chip active" data-player="">全部</div>
        </div>
    </div>
    <!-- 强度筛选 -->
    <div class="filter-group">
        <div class="filter-label">强度</div>
        <div class="filter-wrap" id="rankWrap">
            <div class="filter-chip active" data-rank="">全部</div>
            <div class="filter-chip" data-rank="S+">S+</div>
            <div class="filter-chip" data-rank="S">S</div>
            <div class="filter-chip" data-rank="A+">A+</div>
            <div class="filter-chip" data-rank="A">A</div>
        </div>
    </div>
    <!-- 阵营筛选 -->
    <div class="filter-group">
        <div class="filter-label">阵营</div>
        <div class="filter-wrap" id="campWrap">
            <div class="filter-chip active" data-camp="">全部</div>
            <div class="filter-chip" data-camp="河洛">河洛</div>
            <div class="filter-chip" data-camp="三分">三分</div>
            <div class="filter-chip" data-camp="无阵营">无阵营</div>
            <div class="filter-chip" data-camp="逐鹿">逐鹿</div>
            <div class="filter-chip" data-camp="大河流">大河流</div>
            <div class="filter-chip" data-camp="日落海">日落海</div>
        </div>
        <div class="reset-btn" id="reset">重置</div>
    </div>

    <!-- 阵容列表 -->
    <div class="lineup-list" id="list"></div>
</div>

<!-- 弹窗 -->
<div class="modal" id="modal">
    <div class="modal-box">
        <div class="modal-title" id="mTitle"></div>
        <div id="mBody"></div>
    </div>
</div>

<script>
const lineupData = [
    {
        id:1,
        name:"无限复活花木兰",
        rank:"S+",
        player:"嬴律",
        playerImg:"img/yinglv.png",
        camp:["逐鹿","大河流","三分"],
        hard:"中等",
        code:"38337677766581410"
    },
    {
        id:2,
        name:"日落海司空震",
        rank:"S+",
        player:"玉环",
        playerImg:"img/yuhuan.png",
        camp:["日落海"],
        hard:"困难",
        code:"76616412643475690"
    },
    {
        id:3,
        name:"孙膑三分体系",
        rank:"S+",
        player:"孙小宾",
        playerImg:"img/sunxiaobin.png",
        camp:["逐鹿","大河流","河洛"],
        hard:"中等",
        code:"77743464511520968"
    },
    {
        id:4,
        name:"昭君河洛5+2",
        rank:"S+",
        player:"昭君",
        playerImg:"img/zhaojun.png",
        camp:["逐鹿","河洛","三分","日落海"],
        hard:"中等",
        code:"30456997313626170"
    },
    {
        id:5,
        name:"昭君75速冲",
        rank:"S+",
        player:"昭君",
        playerImg:"img/zhaojun.png",
        camp:["逐鹿","河洛","日落海"],
        hard:"中等",
        code:"94633913646845962"
    },
    {
        id:6,
        name:"低阶龙蛇",
        rank:"S",
        player:"昭君",
        playerImg:"img/zhaojun.png",
        camp:["逐鹿","河洛","三分","日落海"],
        hard:"中等",
        code:"119403711597433866"
    }
];
// 收集棋手列表
const playerList = [...new Set(lineupData.map(x=>x.player))];
const playerWrap = document.getElementById('playerWrap');
playerList.forEach(p=>{
    const div = document.createElement('div');
    div.className = "player-avatar-chip";
    div.dataset.player = p;
    div.innerHTML = `<img src="${lineupData.find(i=>i.player===p).playerImg}" alt="${p}">`;
    playerWrap.appendChild(div);
})

let filter = {
    player:"",
    rank:"",
    camp:"",
    keyword:""
}
const listDom = document.getElementById('list');
const modal = document.getElementById('modal');
const mTitle = document.getElementById('mTitle');
const mBody = document.getElementById('mBody');

// 渲染
function render(){
    let arr = [...lineupData];
    if(filter.player) arr = arr.filter(x=>x.player === filter.player);
    if(filter.rank) arr = arr.filter(x=>x.rank === filter.rank);
    if(filter.camp) arr = arr.filter(x=>x.camp.includes(filter.camp));
    if(filter.keyword){
        let kw = filter.keyword.toLowerCase();
        arr = arr.filter(x=>x.name.toLowerCase().includes(kw))
    }
    listDom.innerHTML = arr.map(item=>{
        const campHtml = item.camp.map(c=>`<span class="camp-tag">${c}</span>`).join('');
        return `
        <div class="lineup-card" data-id="${item.id}">
            <div class="card-avatar"><img src="${item.playerImg}"></div>
            <div class="rank-tag">${item.rank}</div>
            <div class="card-body">
                <div class="card-name-row">
                    <span class="lineup-name">${item.name}</span>
                    ${campHtml}
                </div>
                <div class="card-desc">棋手：${item.player} · 成型难度：${item.hard} · 阵容码：${item.code}</div>
            </div>
            <div class="arrow">></div>
        </div>
        `
    }).join('')
    // 卡片点击弹窗
    document.querySelectorAll('.lineup-card').forEach(card=>{
        card.onclick = ()=>{
            const d = lineupData.find(x=>x.id == card.dataset.id);
            mTitle.innerText = d.name;
            mBody.innerHTML = `<p>棋手：${d.player}</p><p>难度：${d.hard}</p><p>阵营：${d.camp.join('、')}</p><p>阵容码：${d.code}</p>`
            modal.classList.add('show')
        }
    })
}
modal.onclick = (e)=>{
    if(e.target === modal) modal.classList.remove('show')
}
// 筛选点击
document.querySelectorAll('#playerWrap .filter-chip, #playerWrap .player-avatar-chip').forEach(el=>{
    el.onclick = ()=>{
        filter.player = el.dataset.player;
        document.querySelectorAll('#playerWrap *').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        render();
    }
})
document.querySelectorAll('#rankWrap .filter-chip').forEach(el=>{
    el.onclick = ()=>{
        filter.rank = el.dataset.rank;
        document.querySelectorAll('#rankWrap .filter-chip').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        render();
    }
})
document.querySelectorAll('#campWrap .filter-chip').forEach(el=>{
    el.onclick = ()=>{
        filter.camp = el.dataset.camp;
        document.querySelectorAll('#campWrap .filter-chip').forEach(x=>x.classList.remove('active'));
        el.classList.add('active');
        render();
    }
})
document.getElementById('search').oninput = (e)=>{
    filter.keyword = e.target.value;
    render();
}
document.getElementById('reset').onclick = ()=>{
    filter = {player:"",rank:"",camp:"",keyword:""};
    document.querySelectorAll('.filter-chip').forEach(x=>x.classList.remove('active'));
    document.querySelector('#playerWrap [data-player=""]').classList.add('active');
    document.querySelector('#rankWrap [data-rank=""]').classList.add('active');
    document.querySelector('#campWrap [data-camp=""]').classList.add('active');
    document.getElementById('search').value = '';
    render();
}
render();
</script>
</body>
</html>
