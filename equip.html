<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>装备库</title>
<link rel="stylesheet" href="equip.css">
</head>
<body>
<div class="top-nav-wrap">
    <a href="hero.html">英雄</a>
    <a href="equip.html" class="active">装备</a>
</div>
<div class="container">
    <h1 class="page-title">全部装备定位</h1>
    <div class="search-box">
        <input id="searchInput" placeholder="搜索装备名称、描述">
    </div>
    <div class="filter-wrap">
        <div class="filter-row">
            <select id="typeFilter" class="filter-select">
                <option value="all">全部类型</option>
                <option value="基础装备">基础装备</option>
                <option value="普通装备">普通装备</option>
                <option value="天赋装备">天赋装备</option>
                <option value="特殊装备">特殊装备</option>
            </select>
            <select id="posFilter" class="filter-select">
                <option value="all">全部定位</option>
                <option value="物理装备">物理装备</option>
                <option value="法术装备">法术装备</option>
                <option value="防御装备">防御装备</option>
                <option value="通用装备">通用装备</option>
            </select>
        </div>
    </div>

    <!-- 虚拟滚动容器【核心】 -->
    <div id="virtualWrap" class="virtual-wrap">
        <div id="virtualPhantom" class="virtual-phantom"></div>
        <div id="virtualList" class="virtual-list"></div>
    </div>
</div>

<!-- 弹窗 -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span id="closeModal" class="modal-close">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>

<script src="equip.js"></script>
</body>
</html>
