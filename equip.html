<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>装备牌</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
}

body {
    background-color: #12161f;
    color: #e6e8ef;
    background-image:
        radial-gradient(circle at 20% 10%, rgba(255, 211, 105, 0.08), transparent 40%),
        radial-gradient(circle at 80% 30%, rgba(123, 63, 216, 0.08), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(255, 255, 255, 0.03), transparent 50%);
    min-height: 100vh;
}

/* 顶部导航 */
.top-nav-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 16px 20px;
    background-color: rgba(18, 22, 31, 0.75);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 99;
}

.top-nav-wrap a {
    text-decoration: none;
    color: #b4b9c6;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 15px;
    transition: all 0.2s;
    position: relative;
}

.top-nav-wrap a:hover {
    color: #ffd369;
    background-color: rgba(255, 211, 105, 0.08);
}

.top-nav-wrap a.active {
    color: #ffd369;
}

.top-nav-wrap a.active::after {
    content: "";
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 4px;
    height: 3px;
    background-color: #ffd369;
    border-radius: 2px;
}

.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px;
}

.page-title {
    font-size: 32px;
    text-align: center;
    margin-bottom: 24px;
    color: #ffd369;
}

/* 搜索框 */
.search-box {
    display: flex;
    align-items: center;
    width: 100%;
    margin: 0 auto 20px;
    background: #1c212c;
    border: 1px solid #333844;
    border-radius: 12px;
    padding: 12px 18px;
}

.search-box input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #e6e8ef;
    font-size: 16px;
    padding-left: 10px;
}

.search-box input::placeholder {
    color: #686e7c;
}

/* 筛选区 */
.filter-wrap {
    margin-bottom: 24px;
}

.filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
}

.filter-select {
    appearance: none;
    background-color: #1c212c;
    border: 1px solid #333844;
    color: #e6e8ef;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    cursor: pointer;
    min-width: 180px;
}

.filter-select:focus {
    border-color: #ffd369;
}

/* 装备卡片网格 */
.equip-card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
    justify-items: center;
}

.equip-card-item {
    background: transparent;
    border: 0;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.3s ease;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    margin: 0 auto;
}

.equip-card-item:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(255, 211, 105, 0.15);
}

.equip-card-item img {
    display: block;
    width: auto;
    height: auto;
    max-width: 100%;
    border-radius: 16px;
}

/* 弹窗 */
.modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
    backdrop-filter: blur(4px);
}

.modal-content {
    width: min(860px, 100%);
    background: linear-gradient(145deg, #0c0906 0%, #17120a 45%, #0b0805 100%);
    border: 1px solid #7c6538;
    border-radius: 20px;
    max-height: 86vh;
    overflow-y: auto;
    padding: 32px;
    box-shadow: 0 0 40px rgba(255, 211, 105, 0.12);
}

.modal-close {
    float: right;
    color: #888;
    font-size: 26px;
    cursor: pointer;
    transition: 0.2s;
}

.modal-close:hover {
    color: #ffd369;
}

.modal h2 {
    color: #ffd369;
    margin-bottom: 10px;
    font-size: 26px;
}

.modal-sub {
    color: #9aa0b0;
    margin-bottom: 16px;
}

.modal-block {
    margin: 16px 0;
    background: #1c212c;
    border: 1px solid #282d38;
    border-radius: 14px;
    padding: 16px 18px;
}

.modal-content h4 {
    color: #ffd369;
    margin-bottom: 20px !important;
    font-size: 15px;
}

.modal-block p {
    color: #b4b9c6;
    line-height: 1.8;
    font-size: 14px;
}

/* 弹窗头部 */
.hero-header-bar {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 18px;
    padding: 14px 16px;
    background: linear-gradient(180deg, rgba(255,211,105,0.08), rgba(255,211,105,0.02));
    border: 1px solid #4b3e24;
    border-radius: 16px;
}

.hero-icon-wrap {
    display: flex;
    align-items: flex-start;
    gap: 14px;
}

.hero-main-icon {
    width: 84px;
    height: 84px;
    border-radius: 16px;
    border: 2px solid #c9a258;
    object-fit: cover;
    display: block;
}

.hero-name-title {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 4px;
}

.hero-name-large {
    font-size: 34px;
    font-weight: bold;
    color: #ffd369;
}

.hero-tags-top {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 6px;
}

.tag-camp {
    padding: 6px 12px;
    border-radius: 99px;
    font-size: 13px;
    border: 1px solid #7c6538;
    background: linear-gradient(180deg, #3a2a14, #2a1e10);
    color: #ffd369;
}

/* 手机响应式 */
@media (max-width: 768px) {
    .modal-content {
        padding: 20px;
    }

    .hero-header-bar {
        flex-direction: column;
        align-items: flex-start;
    }
}
</style>
</head>

            {id:77,name:"征服之剑",type:"特殊装备",pos:"物理装备",smallImg:"images/equip/zhengfuzhijian.png",img:"images/equip/zhengfuzhijian.png",desc:"",source:"",combine:""}
        ];

        const equipCardList = document.getElementById('equipCardList');
        const searchInput = document.getElementById('searchInput');
        const typeFilter = document.getElementById('typeFilter');
        const posFilter = document.getElementById('posFilter');
        const modal = document.getElementById('detailModal');
        const modalBody = document.getElementById('modalBody');
        const closeModal = document.getElementById('closeModal');

        function renderList(list) {
            if (!equipCardList) {
                console.error("❌ 找不到容器 equipCardList");
                return;
            }

            console.log("🟡 渲染装备数量：", list.length);
            equipCardList.innerHTML = '';

            if (list.length === 0) {
                equipCardList.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 60px 0;">没有匹配的装备</div>`;
                return;
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'equip-card-item';
                card.innerHTML = `<img src="${item.smallImg}" alt="${item.name}" loading="lazy">`;
                card.onclick = () => openModal(item);
                equipCardList.appendChild(card);
            });
        }

        function filterData() {
            const kw = searchInput ? searchInput.value.trim().toLowerCase() : '';
            const t = typeFilter ? typeFilter.value : 'all';
            const p = posFilter ? posFilter.value : 'all';

            const result = equipList.filter(item => {
                const matchType = t === 'all' || item.type === t;
                const matchPos = p === 'all' || item.pos === p;
                const matchKw = !kw || item.name.toLowerCase().includes(kw) || (item.desc && item.desc.toLowerCase().includes(kw));
                return matchType && matchPos && matchKw;
            });

            renderList(result);
        }

        function openModal(item) {
            if (!modal || !modalBody) return;

            modalBody.innerHTML = `
                <div class="hero-header-bar">
                    <div class="hero-icon-wrap">
                        <img class="hero-main-icon" src="${item.img}" alt="${item.name}">
                        <div class="hero-name-title">
                            <div class="hero-name-large">${item.name}</div>
                            <div class="hero-tags-top">
                                <span class="tag-camp">${item.type}</span>
                                <span class="tag-camp">${item.pos}</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-block">
                    <h4>装备效果</h4>
                    <p>${item.desc || '暂无效果描述'}</p>
                </div>

                <div class="modal-block">
                    <h4>合成路线</h4>
                    <p>${item.combine || '不可合成 / 暂无合成信息'}</p>
                </div>

                <div class="modal-block">
                    <h4>获取途径</h4>
                    <p>${item.source || '暂无'}</p>
                </div>
            `;

            modal.style.display = 'flex';
        }

        function closeModalFunc() {
            if (modal) modal.style.display = 'none';
        }

        if (closeModal) closeModal.addEventListener('click', closeModalFunc);
        if (modal) modal.addEventListener('click', e => {
            if (e.target === modal) closeModalFunc();
        });

        if (searchInput) searchInput.addEventListener('input', filterData);
        if (typeFilter) typeFilter.addEventListener('change', filterData);
        if (posFilter) posFilter.addEventListener('change', filterData);

        filterData();
    });
    </script>
