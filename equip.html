<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>装备牌</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- 顶部导航 -->
<div class="top-nav-wrap">
    <a href="./index.html">首页</a>
    <a href="./lineup.html">阵容大全</a>
    <a href="./player.html">棋手</a>
    <a href="./hero-card.html">英雄牌</a>
    <a href="./talent.html">天赋牌</a>
    <a href="./equip.html" class="active">装备牌</a>
    <a href="./effect.html">效果牌</a>
    <a href="./info-gap.html">信息差</a>
</div>
<div class="container">
    <h2 class="page-title">装备牌</h2>
    <!-- 搜索框 -->
    <div class="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#888e9c">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input id="searchInput" type="text" placeholder="搜索装备名称、效果关键词..." />
    </div>
    <!-- 筛选区 -->
    <div class="filter-wrap">
        <div class="filter-row">
            <select id="typeFilter" class="filter-select">
                <option value="all">全部类型</option>
                <option value="基础装备">基础装备</option>
                <option value="普通装备">普通装备</option>
                <option value="天赋装备">天赋装备</option>
                <option value="特殊装备">特殊装备</option>
            </select>
            <select id="posFilter" class="filter-select">
                <option value="all">全部定位</option>
                <option value="物理装备">物理装备</option>
                <option value="法术装备">法术装备</option>
                <option value="防御装备">防御装备</option>
                <option value="通用装备">通用装备</option>
            </select>
        </div>
    </div>
    <!-- 装备卡片网格 -->
    <div class="hero-card-grid" id="equipCardList"></div>
</div>
<!-- 弹窗 -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <span class="modal-close" id="closeModal">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>
<script src="equip-card.js"></script>
</body>
</html>
