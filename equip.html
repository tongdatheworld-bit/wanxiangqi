<!DOCTYPE html>

<meta charset="UTF-8">
<title>装备牌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{background:#12141a;color:#fff;padding:0}
/* 导航栏 */
.nav-wrap{background:#1a1d26;padding:16px 24px;text-align:center;gap:6px;display:flex;justify-content:center;flex-wrap:wrap}
.nav-wrap a{color:#b9bcca;text-decoration:none;padding:6px 12px;border-radius:4px;font-size:15px}
.nav-wrap a.active{color:#ffd147;font-weight:bold}
.page-title{text-align:center;font-size:28px;color:#ffd147;padding:20px 0;font-weight:bold}
.top-bar{width:92%;margin:0 auto 20px}
.search-input{width:100%;background:#1e222d;border:1px solid #333846;color:#fff;border-radius:8px;padding:10px 14px;font-size:14px;outline:none}
.filter-row{width:92%;margin:14px auto;display:flex;gap:12px}
.filter-row select{background:#1e222d;color:#fff;border:1px solid #333846;border-radius:6px;padding:8px 10px;min-width:140px}
/* 卡片网格，一行6张，和你英雄页一致 */
.card-grid{width:92%;margin:0 auto;display:grid;grid-template-columns:repeat(6, 1fr);gap:16px}
.item-card{background:#1e222d;border-radius:10px;overflow:hidden;border:1px solid #333846;cursor:pointer;transition:0.2s}
.item-card:hover{border-color:#ffd147;transform:translateY(-3px)}
.card-img{width:100%;aspect-ratio:1 / 1;background:#282c3a;object-fit:cover}
.card-name{text-align:center;padding:8px 6px;font-size:16px;font-weight:500;color:#fff}
.card-desc{padding:0 8px 12px;font-size:12px;color:#b0b4c0;text-align:center;line-height:1.4}
/* 弹窗遮罩 */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:999}
.modal-box{width:440px;background:#1e222d;border-radius:12px;border:1px solid #444;padding:24px}
.modal-name{font-size:22px;color:#ffd147;margin-bottom:12px}
.modal-tag{display:inline-block;background:#2c3140;padding:3px 8px;border-radius:4px;font-size:13px;margin-right:6px;color:#ddd}
.modal-block{margin-top:16px}
.modal-block h4{color:#ffd147;font-size:15px;margin-bottom:6px}
.modal-block p{color:#d1d5e0;font-size:14px;line-height:1.5}
</style>
</head>

<div class="filter-row">
    <select id="typeFilter">

        <option value="天赋装备">天赋装备</option>

    </select>
    <select id="keywordFilter">

    </select>
</div>

<div class="card-grid" id="equipCardList"></div>

<div class="modal" id="detailModal">

const equipCardList = document.getElementById('equipCardList');
const searchInput = document.getElementById('searchInput');
const typeFilter = document.getElementById('typeFilter');
const posFilter = document.getElementById('posFilter');
const modal = document.getElementById('detailModal');
const modalBody = document.getElementById('modalBody');

function renderList(list) {
    equipCardList.innerHTML = '';
    if(list.length === 0){
        equipCardList.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:#888">没有匹配的装备</div>`;
        return;
    }
    list.forEach(item => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.innerHTML = `
            <img class="card-img" src="${item.smallImg}" alt="${item.name}">
            <div class="card-name">${item.name}</div>
            <div class="card-desc">${item.desc || '暂无描述'}</div>
        `;
        card.onclick = () => openModal(item);
        equipCardList.appendChild(card);
    })
}
function filterData() {
    let kw = searchInput.value.trim().toLowerCase();
    let t = typeFilter.value;
    let p = posFilter.value;
    const result = equipList.filter(item=>{
        const matchType = t === 'all' || item.type === t;
        const matchPos = p === 'all' || item.pos === p;
        const matchKw = !kw || item.name.toLowerCase().includes(kw) || (item.desc && item.desc.toLowerCase().includes(kw));
        return matchType && matchPos && matchKw;
    })
    renderList(result);
}
function openModal(item){
    modalBody.innerHTML = `
        <div class="modal-name">${item.name}</div>
        <div>
            <span class="modal-tag">${item.type}</span>
            <span class="modal-tag">${item.pos}</span>
        </div>
        <div class="modal-block">
            <h4>装备效果</h4>
            <p>${item.desc || '暂无效果描述'}</p>
        </div>
        <div class="modal-block">
            <h4>合成路线</h4>
            <p>${item.combine || '不可合成 / 暂无合成信息'}</p>
        </div>
        <div class="modal-block">
            <h4>获取途径</h4>
            <p>${item.source || '暂无'}</p>
        </div>
    `;
    modal.style.display = 'flex';
}
modal.addEventListener('click',e=>{
    if(e.target === modal) modal.style.display = 'none';
})
searchInput.addEventListener('input',filterData);
typeFilter.addEventListener('change',filterData);
posFilter.addEventListener('change',filterData);
filterData();
})
</script>
</body>
</html>
