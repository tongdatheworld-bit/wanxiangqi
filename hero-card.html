<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>英雄牌</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="hero-card.css" />
</head>
<body>
<!-- 顶部导航 -->
<div class="top-nav-wrap">
    <a href="./index.html">首页</a>
    <a href="./lineup.html">阵容大全</a>
    <a href="./player.html">棋手</a>
    <a href="./hero-card.html" class="active">英雄牌</a>
    <a href="./talent.html">天赋牌</a>
    <a href="./equip.html">装备牌</a>
    <a href="./effect.html">效果牌</a>
    <a href="./info-gap.html">信息差</a>
</div>
<div class="container">
    <h2 class="page-title">英雄牌</h2>
    <!-- 搜索框 -->
    <div class="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#888e9c">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input id="searchInput" type="text" placeholder="搜索名称、描述、阵营或相关关键词..." />
    </div>
    <!-- 筛选区：改成横向标签，和阵容大全UI统一 -->
    <div class="filter-wrap">
        <!-- 品阶 -->
        <div class="filter-row">
            <span class="filter-label">品阶</span>
            <div class="filter-btn-group" data-filter="stage">
                <button class="filter-btn active" data-val="all">全部品阶</button>
                <button class="filter-btn" data-val="1">1阶</button>
                <button class="filter-btn" data-val="2">2阶</button>
                <button class="filter-btn" data-val="3">3阶</button>
                <button class="filter-btn" data-val="4">4阶</button>
                <button class="filter-btn" data-val="5">5阶</button>
            </div>
        </div>
        <!-- 阵营 -->
        <div class="filter-row">
            <span class="filter-label">阵营</span>
            <div class="filter-btn-group" data-filter="camp">
                <button class="filter-btn active" data-val="all">全部阵营</button>
                <button class="filter-btn" data-val="大河流域">大河流域</button>
                <button class="filter-btn" data-val="河洛">河洛</button>
                <button class="filter-btn" data-val="日落海">日落海</button>
                <button class="filter-btn" data-val="三分之地">三分之地</button>
                <button class="filter-btn" data-val="逐鹿">逐鹿</button>
                <button class="filter-btn" data-val="无阵营">无阵营</button>
            </div>
        </div>
        <!-- 关键词 -->
        <div class="filter-row">
            <span class="filter-label">关键词</span>
            <div class="filter-btn-group" data-filter="keyword">
                <button class="filter-btn active" data-val="all">全部关键词</button>
                <button class="filter-btn" data-val="牺牲">牺牲</button>
                <button class="filter-btn" data-val="合成">合成</button>
                <button class="filter-btn" data-val="整备">整备</button>
                <button class="filter-btn" data-val="阿科米亚核心">阿科米亚核心</button>
                <button class="filter-btn" data-val="登场">登场</button>
                <button class="filter-btn" data-val="凯旋">凯旋</button>
                <button class="filter-btn" data-val="临时等级">临时等级</button>
                <button class="filter-btn" data-val="退场">退场</button>
                <button class="filter-btn" data-val="败阵">败阵</button>
                <button class="filter-btn" data-val="开团">开团</button>
                <button class="filter-btn" data-val="图腾">图腾</button>
                <button class="filter-btn" data-val="夺取">夺取</button>
                <button class="filter-btn" data-val="闪现">闪现</button>
                <button class="filter-btn" data-val="复生">复生</button>
            </div>
        </div>
    </div>
    <!-- 英雄牌列表 -->
    <div class="hero-card-grid" id="heroCardList"></div>
</div>
<!-- 详情弹窗 -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <span class="modal-close" id="closeModal">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>
<script src="hero-card.js"></script>
</body>
</html>
