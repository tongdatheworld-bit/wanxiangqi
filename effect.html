<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>效果牌</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="effect-card.css" />
</head>
<body>

<!-- 顶部导航 -->
<div class="top-nav-wrap">
    <a href="./index.html">首页</a>
    <a href="./lineup.html">阵容大全</a>
    <a href="./player.html">棋手</a>
    <a href="./hero-card.html">英雄牌</a>
    <a href="./talent.html">天赋牌</a>
    <a href="./equip.html">装备牌</a>
    <a href="./effect.html"class="active">效果牌</a>
    <a href="./info-gap.html">信息差</a>
</div>

<div class="container">
    <div class="subtitle-tag">EFFECT CARD DATA</div>
    <h2 class="page-title">效果牌</h2>
    <div class="desc-line">万象一图诀 · 友情打造</div>

    <!-- 搜索框【通栏，和装备一模一样】 -->
    <div class="search-box">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#888e9c">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input id="effectSearchInput" type="text" placeholder="搜索名称、描述、品阶、阵营..." />
    </div>
    <!-- 筛选区 -->
    <div class="filter-wrap">
        <div class="filter-row">
            <select id="effectTierFilter" class="filter-select">
                <option value="all">全部品阶</option>
                <option value="一阶">一阶</option>
                <option value="二阶">二阶</option>
                <option value="三阶">三阶</option>
                <option value="四阶">四阶</option>
                <option value="五阶">五阶</option>
                <option value="六阶">六阶</option>
            </select>
            <select id="effectCampFilter" class="filter-select">
                <option value="all">全部阵营</option>
                <option value="三分之地">三分之地</option>
                <option value="日落海">日落海</option>
                <option value="大河流域">大河流域</option>
                <option value="河洛">河洛</option>
                <option value="逐鹿">逐鹿</option>
            </select>
        </div>
    </div>

    <!-- 效果牌列表 -->
    <div class="effect-card-grid" id="effectCardList"></div>
</div>

<!-- 详情弹窗 -->
<div class="modal" id="detailModal">
    <div class="modal-content">
        <span class="modal-close" id="closeModal">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>

<script src="effect-card.js"></script>
</body>
</html>
