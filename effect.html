<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>效果牌 - 王者万象棋 - 万象一图诀</title>
    <base href="./">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #12161f;
            color: #e6e8ef;
            background-image: radial-gradient(circle at 40% 20%, rgba(204, 164, 79, 0.08), transparent 45%);
            min-height: 100vh;
        }
        /* 顶部导航栏 */
        .top-nav-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 16px 20px;
            background-color: rgba(18, 22, 31, 0.75);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 99;
        }
        .top-nav-wrap a {
            text-decoration: none;
            color: #b4b9c6;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 15px;
            transition: all 0.2s;
        }
        .top-nav-wrap a:hover {
            color: #ffd369;
            background-color: rgba(255,211,105,0.08);
        }
        .top-nav-wrap a.active {
            color: #ffd369;
            position: relative;
        }
        .top-nav-wrap a.active::after{
            content:'';
            position:absolute;
            left:16px;
            right:16px;
            bottom:-4px;
            height:4px;
            background:#ffd369;
            border-radius:99px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .page-title {
            text-align:center;
            margin-bottom:30px;
        }
        .subtitle-tag {
            color: #b8a060;
            letter-spacing: 4px;
            font-size:14px;
            margin-bottom:12px;
        }
        h1 {
            font-size: 40px;
            line-height: 1.2;
            font-weight: 600;
        }
        .yellow-text {
            color: #ffd369;
        }
        .desc-line {
            color:#9298a6;
            margin:10px 0 24px;
            font-size:14px;
        }
        /* 筛选栏 */
        .filter-row {
            display:flex;
            gap:12px;
            justify-content:center;
            flex-wrap:wrap;
            margin-bottom:24px;
        }
        .filter-row select {
            background:#1c212c;
            color:#e6e8ef;
            border:1px solid #333844;
            padding: 8px 12px;
            border-radius:8px;
            outline:none;
        }
        /* 搜索框 */
        .search-box {
            display:flex;
            align-items:center;
            width: min(700px, 100%);
            margin:0 auto 36px;
            background: #1c212c;
            border: 1px solid #333844;
            border-radius:12px;
            padding:14px 20px;
        }
        .search-box input {
            flex:1;
            background:transparent;
            border:none;
            outline:none;
            color:#e6e8ef;
            font-size:16px;
            padding-left:10px;
        }
        .search-box input::placeholder {
            color:#68707c;
        }
        /* 卡片网格 */
        .card-grid {
            display:grid;
            grid-template-columns: repeat(auto-fill, minmax(200px,1fr));
            gap:16px;
        }
        .effect-card-item {
            background:#1c212c;
            border-radius:10px;
            padding:14px;
            border:1px solid #282d38;
            transition:0.2s;
            cursor:pointer;
        }
        .effect-card-item:hover {
            border-color:rgba(255,211,105,0.35);
        }
        .effect-card-cover img {
            width:100%;
            border-radius:8px;
            object-fit:cover;
        }
        /* 弹窗 */
        #detailModal {
            position: fixed;
            inset:0;
            background:rgba(0,0,0,0.75);
            display:none;
            align-items:center;
            justify-content:center;
            z-index:999;
            padding:20px;
        }
        .modal-content {
            background:#12161f;
            border:1px solid #333844;
            border-radius:14px;
            max-width:720px;
            width:100%;
            max-height:90vh;
            overflow-y:auto;
            padding:24px;
        }
        .split-line {
            height:1px;
            background:#282d38;
            margin:20px 0;
        }
        .modal-block h4 {
            color:#ffd369;
            margin-bottom:12px;
        }
        /* 弹窗头部 */
        .hero-header-bar {
            display:flex;
            align-items:center;
            gap:16px;
        }
        .hero-icon-wrap {
            display:flex;
            align-items:center;
            gap:16px;
        }
        .hero-main-icon {
            width:80px;
            height:80px;
            border-radius:10px;
            object-fit:cover;
        }
        .hero-name-large {
            font-size:24px;
            color:#ffd369;
            font-weight:bold;
        }
        .tag-stage {
            display:inline-block;
            background:rgba(255,211,105,0.12);
            color:#ffd369;
            padding:3px 8px;
            border-radius:6px;
            font-size:13px;
            margin-top:6px;
        }
    </style>
</head>
<body>
    <!-- 导航 -->
    <div class="top-nav-wrap">
        <a href="./index.html">首页</a>
        <a href="./lineup.html">阵容大全</a>
        <a href="./player.html">棋手</a>
        <a href="./hero-card.html">英雄牌</a>
        <a href="./talent.html">天赋牌</a>
        <a href="./equip.html">装备牌</a>
        <a href="./effect.html" class="active">效果牌</a>
        <a href="./info-gap.html">信息差</a>
    </div>

    <div class="container">
        <div class="page-title">
            <div class="subtitle-tag">EFFECT DATA</div>
            <h1>效果<span class="yellow-text">牌库</span></h1>
            <div class="desc-line">万象一图诀 · 效果牌资料</div>
        </div>

        <div class="filter-row">
            <select id="effectTypeFilter">
                <option value="all">全部类型</option>
                <option value="增益">增益</option>
                <option value="减益">减益</option>
                <option value="召唤">召唤</option>
                <option value="伤害">伤害</option>
            </select>
        </div>

        <div class="search-box">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#888e9c">
                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input id="effectSearchInput" type="text" placeholder="搜索效果牌名称...">
        </div>

        <div class="card-grid" id="effectCardList">
            <!-- 效果牌卡片渲染区域 -->
        </div>
    </div>

    <!-- 弹窗 -->
    <div id="detailModal">
        <div class="modal-content" id="modalBody">
        </div>
    </div>

<script type="module">
    import { allEffectData } from './effect.js';

    let currentEffectType = 'all';
    let effectSearchKw = '';
    const modal = document.getElementById('detailModal');
    const modalBody = document.getElementById('modalBody');

    document.getElementById('effectTypeFilter').addEventListener('change', e=>{
        currentEffectType = e.target.value;
        renderEffectList();
    })
    document.getElementById('effectSearchInput').addEventListener('input', e=>{
        effectSearchKw = e.target.value.trim().toLowerCase();
        renderEffectList();
    })

    function renderEffectList(){
        const wrap = document.getElementById('effectCardList');
        let filterArr = [...allEffectData];
        if(currentEffectType !== 'all'){
            filterArr = filterArr.filter(item => item.type === currentEffectType)
        }
        if(effectSearchKw){
            filterArr = filterArr.filter(item=> item.name.toLowerCase().includes(effectSearchKw))
        }
        if (!filterArr.length) {
            wrap.innerHTML = `<div style="text-align:center;color:#68707c;padding:40px">没有匹配的效果牌</div>`;
            return;
        }
        // 列表使用小图，没有小图自动回退大图
        wrap.innerHTML = filterArr.map(item => `
            <div class="effect-card-item" data-id="${item.id}">
                <div class="effect-card-cover">
                    <img src="${item.smallImg ?? item.img}" alt="${item.name}">
                    <div style="text-align:center;margin-top:8px;color:#ffd369">${item.name}</div>
                </div>
            </div>
        `).join('');
        bindEffectClick();
    }

    function bindEffectClick(){
        document.querySelectorAll('.effect-card-item').forEach(card=>{
            card.onclick = ()=>{
                const id = Number(card.dataset.id);
                const find = allEffectData.find(x=>x.id === id);
                if(!find) return;
                modalBody.innerHTML = `
                <div class="hero-header-bar">
                    <div class="hero-icon-wrap">
                        <img class="hero-main-icon" src="${find.img}" alt="${find.name}">
                        <div class="hero-name-title">
                            <div class="hero-name-main">
                                <span class="hero-name-large">${find.name}</span>
                            </div>
                            <div class="hero-tags-top">
                                <span class="tag-stage">${find.type}</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="split-line"></div>
                <div class="modal-block">
                    <h4>效果描述</h4>
                    <div style="font-size:18px; line-height:1.6;">${find.desc || "暂无描述"}</div>
                </div>
                <div class="split-line"></div>
                <div class="modal-block">
                    <h4>获取方式</h4>
                    <div>${find.source || "暂无"}</div>
                </div>
                `;
                modal.style.display = 'flex';
            }
        })
    }
    // 空白处关闭弹窗
    modal.addEventListener('click', (e)=>{
        if(e.target === modal){
            modal.style.display = 'none';
        }
    })

    renderEffectList();
</script>

<!-- 导航高亮脚本 -->
<script>
(function(){
  const navLinks = document.querySelectorAll('.top-nav-wrap a');
  const currentPath = location.pathname.split('/').pop() || 'index.html';
  navLinks.forEach(link => {
    link.classList.remove('active');
    const href = link.getAttribute('href').replace('./','');
    if(href === currentPath){
      link.classList.add('active');
    }
  })
})();
</script>
</body>
</html>
